  - id: silver.chat_message
    layer: silver
    grain: "one real message, unique on (platform, platform_message_id); re-deliveries removed."
    built_from: [bronze.chat, bronze.crm, bronze.crm_restricted]
    built_by: "pipeline/silver/sql/20_chat_message.sql (intent patterns: pipeline/silver/intents.yml)"
    load: "full rebuild each run. Reject R20 (not JSON / no key, time or platform), R07 (staff message without employee); warn R21 (time vs received), R22 (re-delivery, dropped), R23 (unknown staff code), R24 (Bronze and CRM disagree), S05 (unknown field)"
    access: data team, ML job, warehouse load (no text here)
    columns:
      platform: {meaning: "line, messenger, instagram", rule: "Bronze platform; outbound: body.platform; else the CRM account's Platform", from: [bronze.chat.platform, bronze.chat.outbound.platform, crm.master.CustomerChannelAccount.Platform]}
      platform_message_id: {meaning: "The platform's message key", rule: "LINE message.id, Meta message.mid, outbound message_id; de-duplicated keeping the earliest received_at", from: [bronze.chat.line.message.id, bronze.chat.meta.message.mid, bronze.chat.outbound.message_id, crm.transaction.ChatMessage.PlatformMessageID]}
      sent_at: {meaning: Send time in Bangkok local time, rule: "timezone('Asia/Bangkok', to_timestamp(timestamp / 1000)); outbound: sent_at UTC → Bangkok; CRM SentAt if not in Bronze", from: [bronze.chat.line.timestamp, bronze.chat.meta.timestamp, bronze.chat.outbound.sent_at, crm.transaction.ChatMessage.SentAt]}
      direction: {meaning: "In (couple) or Out (us)", rule: "inbound webhooks → 'In'; send log → 'Out'", from: [bronze.chat.platform, crm.transaction.ChatMessage.Direction]}
      sender_type: {meaning: "customer, staff or bot", rule: "inbound → 'customer'; outbound → body.sender_type", from: [bronze.chat.outbound.sender_type, crm.transaction.ChatMessage.SenderType]}
      employee_id: {meaning: Staff member who sent it, rule: "coalesce(CRM EmployeeID, Employee where EmployeeCode = staff_code)", from: [crm.transaction.ChatMessage.EmployeeID, bronze.chat.outbound.staff_code, crm.master.Employee.EmployeeCode]}
      inquiry_id: {meaning: Inquiry the message belongs to, rule: "CRM ChatMessage joined on PlatformMessageID", from: [crm.transaction.ChatMessage.InquiryID]}
      customer_account_id: {meaning: The couple's chat account, from: [crm.transaction.ChatMessage.CustomerAccountID]}
      tracking_code: {meaning: "Tracking code (#TIKTOK, #WEB, #FAIR) or Meta ad id", rule: "regexp '^\\s*(#[A-Z0-9]+)' on the text, else referral.ad_id; CRM TrackingCode if not in Bronze", from: [bronze.chat.line.message.text, bronze.chat.meta.message.text, bronze.chat.meta.referral.ad_id, crm.transaction.ChatMessage.TrackingCode]}
      text_len: {meaning: Characters in the text, rule: length(text), from: [bronze.chat.line.message.text, bronze.chat.meta.message.text, bronze.chat.outbound.text]}
      lang: {meaning: "th, en or mixed", rule: "th if Thai characters > 50 % of Thai + Latin letters; en if no Thai; else mixed", from: [bronze.chat.line.message.text, bronze.chat.meta.message.text, bronze.chat.outbound.text]}
      has_question: {meaning: The message asks something, rule: "regexp '\\?|ไหม|มั้ย|มั๊ย|หรือเปล่า|ยัง|ไร'", from: [bronze.chat.line.message.text, bronze.chat.meta.message.text, bronze.chat.outbound.text]}
      intent_ask_price: &intent {meaning: "1 if the couple's message matches the intent's patterns (intents.yml, Thai and English); 0 for our messages", rule: "regexp_matches(text, patterns of the intent, 'i') on inbound text", from: [bronze.chat.line.message.text, bronze.chat.meta.message.text]}
      intent_ask_availability: *intent
      intent_mention_date: *intent
      intent_mention_guests: *intent
      intent_ask_package_detail: *intent
      intent_ask_meeting: *intent
      intent_price_objection: *intent
      intent_family_decision: *intent
      intent_competitor: *intent
      intent_positive: *intent
      intent_commit: *intent
