      budget_text: {meaning: Budget as typed, from: [crm.transaction.Inquiry.BudgetRange]}
      budget_band: {meaning: "Canonical band: 300k-500k, 500k-1M, 1M-1.5M, 1.5M+, Unknown (R05)", rule: "free text → thousands of baht by regex ('6 แสน' = 600, '1.2M' / '1 ล้าน' = ×1000, '600k', '800,000' / 1000); <= 500 → 300k-500k; < 1000 → 500k-1M; < 1500 → 1M-1.5M; else 1.5M+", from: [crm.transaction.Inquiry.BudgetRange]}
      budget_low_thb: {meaning: Lower bound of the band (THB), rule: "300k-500k → 300,000; 500k-1M → 500,000; 1M-1.5M → 1,000,000; 1.5M+ → 1,500,000", from: [silver.inquiry.budget_band]}
      budget_high_thb: {meaning: Upper bound of the band (THB), rule: "500,000 / 1,000,000 / 1,500,000 / 2,000,000", from: [silver.inquiry.budget_band]}
      budget_midpoint_thb: {meaning: Middle of the band (THB), rule: "(low + high) / 2: 400,000 / 750,000 / 1,250,000 / 1,750,000", from: [silver.inquiry.budget_band]}
      contacted_at: {meaning: First contact by sales, from: [crm.transaction.Inquiry.ContactedDate]}
      consultation_at: {meaning: Consultation meeting, from: [crm.transaction.Inquiry.ConsultationDate]}
      quoted_at: {meaning: Quote sent, from: [crm.transaction.Inquiry.QuotedDate]}
      quoted_amount: {meaning: Quoted fee THB, from: [crm.transaction.Inquiry.QuotedAmount]}
      closed_at: {meaning: Closed, from: [crm.transaction.Inquiry.ClosedDate]}
      closed_by: {meaning: Sales or AutoRule, from: [crm.transaction.Inquiry.ClosedBy]}
      status: {meaning: CRM status, from: [crm.transaction.Inquiry.Status]}
      lost_reason: {meaning: Why it was lost, from: [crm.transaction.Inquiry.LostReason]}
      first_customer_msg_at: {meaning: "The couple's first message", rule: "min(sent_at) of inbound messages of the inquiry", from: [silver.chat_message.sent_at, silver.chat_message.direction, silver.chat_message.inquiry_id]}
      first_staff_reply_at: {meaning: First reply by a person (bots never count), rule: "min(sent_at) of messages with sender_type = 'staff' after first_customer_msg_at", from: [silver.chat_message.sent_at, silver.chat_message.sender_type]}
      last_customer_msg_at: {meaning: "The couple's latest message", rule: "max(sent_at) of inbound messages", from: [silver.chat_message.sent_at, silver.chat_message.direction]}
      response_minutes: {meaning: Minutes to the first staff reply (null for offline channels), rule: "round((first_staff_reply_at − first_customer_msg_at) in seconds / 60, 1); NULL when channel_type = 'Offline'", from: [silver.inquiry.first_staff_reply_at, silver.inquiry.first_customer_msg_at, crm.master.MarketingChannel.ChannelType]}
      response_band: {meaning: "Reply-speed band", rule: "Offline → 'in person'; no reply → 'no logged reply'; < 1 h → '< 1 h'; <= 24 h → '1–24 h'; else '> 24 h'", from: [silver.inquiry.first_staff_reply_at, silver.inquiry.first_customer_msg_at, crm.master.MarketingChannel.ChannelType]}
      first_msg_hour: {meaning: Hour 0-23 the couple first wrote, rule: "hour(coalesce(first_customer_msg_at, InquiryDate))", from: [silver.inquiry.first_customer_msg_at, crm.transaction.Inquiry.InquiryDate]}
      arrived_outside_hours: {meaning: Arrived before 09:00 or from 20:00, rule: "first_msg_hour NOT BETWEEN 9 AND 19", from: [silver.inquiry.first_msg_hour]}
      customer_msgs: {meaning: "Messages from the couple", rule: "count(*) of inbound messages, 0 if none", from: [silver.chat_message.direction]}
      staff_msgs: {meaning: Messages from staff (bots excluded), rule: "count(*) with sender_type = 'staff'", from: [silver.chat_message.sender_type]}
