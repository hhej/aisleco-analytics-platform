# Table and column catalog (M8). One entry per table on the platform, from the CRM to the marts.
# KPIs are in kpis.yml. scripts/build_catalog.py checks this file against the live databases and the Silver Parquet
# files, then writes docs/v2/catalog.html.
#
# Per table:  id (schema-qualified name), layer, grain, built_from, built_by, load, access, columns.
# Per column: meaning; rule (the formula, quoted from the SQL, when the column is derived); from (lineage: the upstream
#             table.column(s)); additivity (fact measures only: additive / semi-additive / non-additive).
# copy_of: <table id> = columns not listed are copied unchanged from that table (SELECT *).
# A reference "table.column" may name a JSON field for Bronze files (e.g. bronze.chat.line.message.text).
version: 1
layers:
  - {id: source, name: Sources, note: "Systems of record: the CRM database, the chat platforms, the fair tablets, two external calendars"}
  - {id: landing, name: Landing, note: "lake/landing/: where pushed and dropped files wait (at most a day) until ingestion moves them"}
  - {id: bronze, name: Bronze, note: "lake/bronze/: exactly as received, append-only, partitioned by receive date"}
  - {id: silver, name: Silver, note: "lake/silver/ (Parquet): cleaned, typed, de-duplicated, no personal data; rebuilt in full each run"}
  - {id: silver_restricted, name: Silver (restricted), note: "lake/silver_restricted/: masked text and display names; ML job and sales_pii load only"}
  - {id: gold, name: Gold, note: "aisleco_dw.gold: Kimball star schema, 5 dimensions and 6 facts (Silver is copied to schema stg first)"}
  - {id: mart, name: Marts, note: "aisleco_dw.mart_*: views per role; dashboards read marts only"}
  - {id: feature, name: Feature store and ML, note: "aisleco_dw.feature and ml: features served to the model, model runs, monitoring"}
  - {id: govern, name: Run log (etl), note: "aisleco_dw.etl: run log, data-quality results, quarantine index, watermarks"}

tables:
# =====================================================================================================================
# SOURCES
# =====================================================================================================================
  - id: crm.master.Customer
    layer: source
    grain: one couple (a customer of the agency).
    built_by: sources/crm/oltp_v6.sql (DDL); rows written by the CRM application (simulated by sim/)
    load: not extracted by the pipeline (see the mismatch list); kept in the CRM only
    access: CRM application
    columns:
      CustomerID: {meaning: "Couple's number; a pseudonymous key used everywhere downstream"}
      District: {meaning: District of residence}
      Province: {meaning: Province of residence}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: "Last change, kept by trigger (drives incremental extraction)"}
  - id: crm.master.CustomerContact
    layer: source
    grain: one contact person of a couple.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: full snapshot of allowed columns only (CustomerContactID, CustomerID, ContactName, Phone, IsPrimaryContact, UpdatedAt), restricted folder"
    access: CRM application; restricted extractor
    columns:
      CustomerContactID: {meaning: Contact number}
      CustomerID: {meaning: The couple}
      ContactName: {meaning: "Contact's first name (personal data)"}
      ContactTitle: {meaning: "Title (Khun, Mr, Ms); not extracted"}
      Phone: {meaning: "Phone number (personal data); masked and hashed in Silver"}
      Email: {meaning: "E-mail (personal data); not extracted"}
      IsPrimaryContact: {meaning: "Y for the couple's main contact"}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.master.CustomerChannelAccount
    layer: source
    grain: one chat account (LINE, Messenger, Instagram user) of a couple.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: full snapshot of allowed columns only (CustomerAccountID, CustomerID, Platform, DisplayName, FirstSeenAt, UpdatedAt), restricted folder"
    access: CRM application; restricted extractor
    columns:
      CustomerAccountID: {meaning: Chat account number}
      CustomerID: {meaning: The couple}
      Platform: {meaning: "line, messenger or instagram"}
      ExternalUserID: {meaning: "The platform's user id; not extracted"}
      DisplayName: {meaning: "Name shown on the platform (personal data)"}
      FirstSeenAt: {meaning: First message from this account}
      FirstTrackingCode: {meaning: "Tracking code of the first message (#TIKTOK, #WEB, #FAIR)"}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.master.MarketingChannel
    layer: source
    grain: one marketing channel.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: full snapshot every run"
    access: CRM application; extractor
    columns:
      ChannelID: {meaning: Channel number}
      ChannelName: {meaning: "LINE OA, Facebook, Instagram, TikTok, Website, Wedding Fair, Referral, Walk-in"}
      ChannelType: {meaning: Online or Offline}
      Platform: {meaning: "Chat platform the channel lands on (line, messenger, instagram); empty for offline"}
      TrackingCode: {meaning: "Code pre-typed in the first message (#TIKTOK, #WEB, #FAIR)"}
      Status: {meaning: Active or not}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.master.Package
    layer: source
    grain: one package price version.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: full snapshot every run"
    access: CRM application; extractor
    columns:
      PackageID: {meaning: Package version number}
      PackageName: {meaning: "Full Planning, Partial Planning, Day-of Coordination, Custom"}
      PackageType: {meaning: "Full, Partial, DayOf, Custom"}
      BasePrice: {meaning: Fixed fee in THB (fixed-fee packages)}
      ServiceFeeType: {meaning: Fixed or Percent}
      ServiceFeeRate: {meaning: "Fee as % of the wedding budget (Full Planning: 12.5 or 13.5)"}
      EffectiveFrom: {meaning: First day this price applies}
      EffectiveTo: {meaning: Last day (empty = still valid)}
      Status: {meaning: Active or not}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.master.EmployeeRole
    layer: source
    grain: one job role.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: full snapshot every run"
    access: CRM application; extractor
    columns:
      RoleID: {meaning: Role number}
      RoleName: {meaning: "e.g. Lead Planner, Coordinator, Sales Executive"}
      RoleGroup: {meaning: "Planning, Wedding day, Sales or Office"}
      Status: {meaning: Active or not}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.master.Employee
    layer: source
    grain: one staff member.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: full snapshot every run"
    access: CRM application; extractor
    columns:
      EmployeeID: {meaning: Staff number}
      EmployeeCode: {meaning: "Staff code; the chat send log identifies staff by it"}
      FirstName: {meaning: "First name; not used downstream"}
      LastName: {meaning: "Last name; not used downstream"}
      Nickname: {meaning: "Nickname used in the office and on the dashboards"}
      HireDate: {meaning: First working day}
      Status: {meaning: Active or left}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.master.EmployeeContract
    layer: source
    grain: one contract period of one employee (role and hours history).
    built_by: "sources/crm/oltp_v6.sql; no overlapping periods per employee (exclusion constraint, oltp_v6_support.sql)"
    load: "Bronze: full snapshot every run"
    access: CRM application; extractor
    columns:
      ContractID: {meaning: Contract number}
      EmployeeID: {meaning: The employee}
      RoleID: {meaning: Role during this contract}
      EmploymentType: {meaning: "FullTime, PartTime or Freelance"}
      StandardWeeklyHours: {meaning: Contracted hours per week}
      MaxConcurrentEvents: {meaning: Weddings the person can run in one week}
      EffectiveFrom: {meaning: First day of the contract}
      EffectiveTo: {meaning: Last day (empty = open-ended)}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.transaction.Inquiry
    layer: source
    grain: one inquiry (a couple contacting the agency once, on one channel).
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: incremental by UpdatedAt watermark (5-minute overlap) + full primary-key list for deletes"
    access: CRM application; extractor
    columns:
      InquiryID: {meaning: Inquiry number}
      CustomerID: {meaning: The couple}
      ChannelID: {meaning: Channel the couple came from}
      IndicativePackageID: {meaning: Package the couple is interested in}
      AssignedSalesEmployeeID: {meaning: Salesperson who owns the lead}
      InquiryDate: {meaning: When the couple first got in touch}
      RequestedEventDate: {meaning: Wedding date the couple asked for}
      BudgetRange: {meaning: "Budget as typed by sales (free text: \"around 600k\", \"6 แสน\", \"1M-1.5M\")"}
      ContactedDate: {meaning: First contact by sales}
      ConsultationDate: {meaning: Consultation meeting}
      QuotedDate: {meaning: Quote sent}
      QuotedAmount: {meaning: Quoted planning fee in THB}
      ClosedDate: {meaning: When the inquiry was closed}
      ClosedBy: {meaning: "Sales (a salesperson closed it) or AutoRule (30 silent days)"}
      Status: {meaning: "New, Contacted, Consulted, Quoted, Converted, Lost"}
      LostReason: {meaning: "Price, Budget changed, Chose competitor, Date unavailable, Scope mismatch, No reply"}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.transaction.ChatMessage
    layer: source
    grain: "one chat message's metadata (the text itself stays in the chat gateway's files)."
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: incremental by UpdatedAt + key list"
    access: CRM application; extractor
    columns:
      ChatMessageID: {meaning: Row number}
      CustomerAccountID: {meaning: The couple's chat account}
      InquiryID: {meaning: Inquiry the message belongs to}
      PlatformMessageID: {meaning: "The platform's message id (LINE message.id, Meta message.mid, outbound message_id)"}
      SentAt: {meaning: When the message was sent (Bangkok time)}
      Direction: {meaning: "In (from the couple) or Out (from us)"}
      SenderType: {meaning: "Customer, Staff or Bot"}
      EmployeeID: {meaning: Staff member who sent it (staff messages)}
      TrackingCode: {meaning: Tracking code found in the message}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.transaction.Event
    layer: source
    grain: one booked wedding.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: incremental by UpdatedAt + key list"
    access: CRM application; extractor
    columns:
      EventID: {meaning: Wedding number}
      CustomerID: {meaning: The couple}
      InquiryID: {meaning: Inquiry it came from (empty for a walk-in booking)}
      PackageID: {meaning: Package booked}
      EventDate: {meaning: Wedding date}
      GuestCount: {meaning: Number of guests}
      ComplexityLevel: {meaning: "Low, Medium or High"}
      AgreedPackagePrice: {meaning: Agreed planning fee in THB}
      Status: {meaning: "Confirmed, Completed or Cancelled"}
      CancelledDate: {meaning: When the booking was cancelled}
      CreatedDate: {meaning: "When the booking was signed (the booking date)"}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.transaction.EventEmployeeAssignment
    layer: source
    grain: one staff member assigned to one wedding.
    built_by: sources/crm/oltp_v6.sql
    load: "Bronze: incremental by UpdatedAt + key list"
    access: CRM application; extractor
    columns:
      EventEmployeeAssignmentID: {meaning: Assignment number}
      EventID: {meaning: The wedding}
      EmployeeID: {meaning: The staff member}
      AssignmentRole: {meaning: "Lead Planner, Planner, Coordinator, Event Staff"}
      AssignedDate: {meaning: When the person was put on the wedding}
      WorkloadHours: {meaning: "Total hours the person will spend on this wedding (planning + wedding day)"}
      IsLead: {meaning: "Y for the lead planner"}
      Status: {meaning: "Active (only active assignments carry hours)"}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: crm.transaction.SalesActivity
    layer: source
    grain: one follow-up by a salesperson (call, LINE message, meeting).
    built_by: "sources/crm/oltp_v6.sql; rows from the web app's \"mark contacted\" button (role crm_app_writer, insert only) and the simulator"
    load: "Bronze: incremental by UpdatedAt + key list"
    access: CRM application; crm_app_writer (insert, read back own columns); extractor
    columns:
      ActivityID: {meaning: Follow-up number}
      InquiryID: {meaning: The inquiry followed up}
      EmployeeID: {meaning: The salesperson}
      ActivityAt: {meaning: When it happened}
      ActivityType: {meaning: "Call, LINE or Meeting"}
      Outcome: {meaning: "Reached, No answer, Left message, Consult booked, Not interested"}
      Source: {meaning: "CallList (from the daily ranked list) or Own (salesperson's own initiative)"}
      ListDate: {meaning: Date of the call list the lead was on}
      CreatedAt: {meaning: When the row was created}
      UpdatedAt: {meaning: Last change (trigger)}
  - id: src.chat_gateway
    layer: source
    grain: "one webhook request from LINE or Meta (Messenger, Instagram), or one record of the shared-inbox send log."
    built_by: "sources/chat_gateway (FastAPI on port 8001): checks the signature, appends the raw body"
    load: "push: each request appended to lake/landing/chat/platform=<p>/received_date=D/hour=HH/events.jsonl"
    access: the platforms (signed requests); pipeline reads
  - id: src.fair_tablet
    layer: source
    grain: one batch of sign-ups uploaded by a booth tablet when it reconnects.
    built_by: tablet app (simulated by sim/)
    load: "file drop into lake/landing/fair_tablet/"
    access: tablets write; pipeline reads
  - id: src.google_holidays
    layer: source
    grain: "one holiday event in Google's public Thai holiday calendar (real, iCalendar)"
    built_by: "sources/external: HTTP GET of the public basic.ics, monthly"
    load: "API pull, 10 s timeout, 3 retries; cached copy in sources/external/fixtures/ for offline runs"
    access: public internet
  - id: src.auspicious_file
    layer: source
    grain: "one auspicious wedding date, in the yearly CSV compiled by marketing"
    built_by: marketing (simulated by sim/)
    load: "file drop into lake/landing/external/"
    access: marketing writes; pipeline reads

# =====================================================================================================================
# BRONZE (raw, as received; the landing path is where the file waited before ingestion)
# =====================================================================================================================
  - id: bronze.crm
    layer: bronze
    grain: one CSV per CRM table per run (changed rows), plus a key list per incremental table and one manifest per run.
    built_from: [crm.master.MarketingChannel, crm.master.Package, crm.master.EmployeeRole, crm.master.Employee, crm.master.EmployeeContract,
                 crm.transaction.Inquiry, crm.transaction.ChatMessage, crm.transaction.Event, crm.transaction.EventEmployeeAssignment,
                 crm.transaction.SalesActivity]
    built_by: pipeline/ingest/crm_cdc.py
    path: "lake/bronze/crm/<Table>/load_date=D/run=N/<Table>.csv (+ <Table>_keys.csv); lake/bronze/crm/_manifests/run=N/manifest.json"
    format: "CSV (PostgreSQL COPY), all columns; manifest with rows, max UpdatedAt, SHA-256, column types"
    load: "transaction tables incremental by UpdatedAt (one shared snapshot, 5-minute overlap, batch cap, parents pulled with children); master tables full snapshot; append-only, kept indefinitely"
    access: data team
    note: "Silver reads every run of a table, keeps the latest version per key (by UpdatedAt, then run) and drops keys missing from the latest key list (deleted in the CRM)."
  - id: bronze.crm_restricted
    layer: bronze
    grain: one CSV per personal-data table per run.
    built_from: [crm.master.CustomerContact, crm.master.CustomerChannelAccount]
    built_by: pipeline/ingest/crm_cdc.py
    path: "lake/bronze/crm_restricted/<Table>/load_date=D/run=N/<Table>.csv (folder mode 700)"
    format: CSV, allowed columns only
    load: full snapshot of allowed columns every run; last 90 days of snapshots kept
    access: restricted job only
  - id: bronze.chat
    layer: bronze
    grain: one webhook request or send-log record (one JSON line), exactly as received; re-deliveries included.
    built_from: [src.chat_gateway]
    built_by: pipeline/ingest/files.py (moves closed hourly files from landing)
    landing: "lake/landing/chat/platform=line|messenger|instagram|outbound/received_date=D/hour=HH/events.jsonl"
    path: "lake/bronze/chat/platform=<p>/received_date=D/hour=HH/events.jsonl"
    format: "JSON lines: received_at, platform, body (raw string), body_sha256"
    load: "append-only; each file recorded in etl.file_checkpoint (name, rows, SHA-256); text purged 2 years after the inquiry closes"
    access: data team; the text only by the restricted ML job
    columns:
      received_at: {meaning: "When the gateway received the request (Bangkok time); the partition date"}
      platform: {meaning: "line, messenger, instagram or outbound"}
      body: {meaning: "The raw request body, unchanged (so the signature can be re-checked)"}
      body_sha256: {meaning: SHA-256 of the body}
      line.message.id: {meaning: "LINE: events[].message.id, the message key"}
      line.timestamp: {meaning: "LINE: events[].timestamp, epoch milliseconds UTC"}
      line.message.text: {meaning: "LINE: events[].message.text, the message text (unstructured)"}
      meta.message.mid: {meaning: "Messenger/Instagram: entry[].messaging[].message.mid, the message key"}
      meta.timestamp: {meaning: "Messenger/Instagram: entry[].messaging[].timestamp, epoch ms UTC"}
      meta.message.text: {meaning: "Messenger/Instagram: the message text"}
      meta.referral.ad_id: {meaning: "Messenger/Instagram: id of the ad the couple clicked"}
      outbound.message_id: {meaning: "Send log: our message key"}
      outbound.sent_at: {meaning: "Send log: send time, UTC ISO"}
      outbound.text: {meaning: "Send log: the text we sent"}
      outbound.sender_type: {meaning: "Send log: staff or bot"}
      outbound.staff_code: {meaning: "Send log: EmployeeCode of the sender"}
      outbound.platform: {meaning: "Send log: platform the reply went to"}
  - id: bronze.fair_tablet
    layer: bronze
    grain: one batch file from one tablet sync (a retried upload arrives twice).
    built_from: [src.fair_tablet]
    built_by: pipeline/ingest/files.py
    landing: "lake/landing/fair_tablet/<device>_<seq>.json"
    path: "lake/bronze/fair_tablet/received_date=D/<device>_<seq>_<sha8>.json"
    format: nested JSON
    load: "append-only; recorded in etl.file_checkpoint; invalid JSON goes to quarantine (R30)"
    access: data team
    columns:
      device_id: {meaning: Tablet id}
      batch_seq: {meaning: "Upload number of that tablet (a retry repeats it)"}
      fair.name: {meaning: Wedding fair name}
      fair.date: {meaning: Fair date}
      synced_at: {meaning: When the tablet uploaded the batch}
      submission.submission_id: {meaning: "submissions[].submission_id: one sign-up"}
      submission.submitted_at: {meaning: When the couple signed up at the booth}
      submission.crm_inquiry_id: {meaning: Inquiry the tablet app created in the CRM}
      submission.couple.phone: {meaning: "Phone (personal data): hashed in Silver, never stored in clear"}
      submission.couple.names: {meaning: "Bride and groom names, LINE id, district (personal data): not read by Silver"}
      submission.wedding.date: {meaning: Planned wedding date}
      submission.wedding.date_flexible: {meaning: Whether the date can move}
      submission.wedding.guests: {meaning: Expected guests}
      submission.wedding.venue_type: {meaning: "e.g. Hotel ballroom, Garden"}
      submission.budget_band: {meaning: Budget band ticked on the form}
      submission.package_interest: {meaning: Package of interest ticked on the form}
      submission.wishes: {meaning: "The couple's own wishes (free text)"}
      submission.consent_marketing: {meaning: Marketing consent}
  - id: bronze.external.th_holidays
    layer: bronze
    grain: one fetch of the holiday calendar (every fetch kept).
    built_from: [src.google_holidays]
    built_by: sources/external + pipeline/ingest/files.py
    path: "lake/bronze/external/th_holidays/fetched_date=D/basic.ics"
    format: iCalendar (ICS)
    load: "monthly pull, append; checked by R40 (parses, >= 15 events a year, Asalha Bucha each year); on failure the last good fetch is used"
    access: data team
    columns:
      DTSTART: {meaning: "VEVENT date of the holiday"}
      SUMMARY: {meaning: "VEVENT name of the holiday (e.g. Asalha Bucha, Valentine's Day)"}
  - id: bronze.external.auspicious
    layer: bronze
    grain: one yearly file of auspicious wedding dates.
    built_from: [src.auspicious_file]
    built_by: pipeline/ingest/files.py
    landing: "lake/landing/external/auspicious_YYYY.csv"
    path: "lake/bronze/external/auspicious/year=YYYY/auspicious_YYYY.csv"
    format: CSV
    load: "yearly file drop, append; the latest file of each year is read"
    access: data team
    columns:
      calendar_date: {meaning: The date}
      date_type: {meaning: "Which publication or tradition rates it (e.g. ThaiAstrology)"}
      auspicious_level: {meaning: "Low, Medium or High"}
      description: {meaning: Free-text note}

# =====================================================================================================================
# SILVER (lake/silver/<table>/data.parquet). Every table: full rebuild from Bronze each run in DuckDB, written to
# silver/_build/run=N/, checked, then swapped in (the previous build kept in silver/_prev). Rows failing a reject rule
# go to lake/quarantine/ instead (rule ids in the rule text). Access: data team, ML job, warehouse load.
# =====================================================================================================================
  - id: silver.auspicious_date
    layer: silver
    grain: one auspicious date per date type.
    built_from: [bronze.external.auspicious]
    built_by: pipeline/silver/sql/05_auspicious_date.sql
    load: full rebuild each run (latest file of each year)
    access: data team, ML job, warehouse load
    columns:
      calendar_date: {meaning: The date, rule: "try_cast(calendar_date AS DATE); reject R41 if null or not in the file's year=YYYY", from: [bronze.external.auspicious.calendar_date]}
      date_type: {meaning: Rating source, rule: trim(date_type), from: [bronze.external.auspicious.date_type]}
      auspicious_level: {meaning: "Low, Medium or High", rule: "trim(auspicious_level); reject R41 if not Low/Medium/High", from: [bronze.external.auspicious.auspicious_level]}
      description: {meaning: Free-text note, from: [bronze.external.auspicious.description]}
  - id: silver.calendar_day
    layer: silver
    grain: one calendar day, 2022-01-01 to 2028-12-31.
    built_from: [bronze.external.th_holidays, silver.auspicious_date]
    built_by: pipeline/silver/sql/06_calendar_day.sql
    load: full rebuild each run (latest holiday fetch)
    access: data team, ML job, warehouse load
    columns:
      date: {meaning: The day, rule: "generate_series(2022-01-01, 2028-12-31, 1 day)"}
      week_start: {meaning: Monday of the ISO week, rule: "date_trunc('week', date)"}
      iso_year: {meaning: ISO year, rule: isoyear(date)}
      iso_week: {meaning: ISO week number, rule: weekofyear(date)}
      month: {meaning: Month 1-12, rule: month(date)}
      year: {meaning: Calendar year, rule: year(date)}
      is_weekend: {meaning: Saturday or Sunday, rule: "isodow(date) >= 6"}
      holiday_name: {meaning: "Holiday names of the day, several joined with \" / \"", rule: "string_agg(SUMMARY, ' / ') per date", from: [bronze.external.th_holidays.SUMMARY, bronze.external.th_holidays.DTSTART]}
      is_public_holiday: {meaning: A day off (observances such as Valentine's Day or Christmas are not), rule: "any holiday that day whose name is not in (Valentine's Day, Christmas Eve, Christmas Day, Chinese New Year's Day, Second/Third Day of Chinese New Year, Mahidol Day)", from: [bronze.external.th_holidays.SUMMARY]}
      is_buddhist_lent: {meaning: Inside Buddhist Lent (weddings are avoided), rule: "date between Asalha Bucha + 1 and Asalha Bucha + 89 of that year; a year without Asalha Bucha in the feed: 20 Jul to 17 Oct", from: [bronze.external.th_holidays.SUMMARY, bronze.external.th_holidays.DTSTART]}
      lent_source: {meaning: "ics (from the calendar) or approximated (no Asalha Bucha that year)", rule: "CASE WHEN Asalha Bucha missing THEN 'approximated' ELSE 'ics'", from: [bronze.external.th_holidays.SUMMARY]}
      is_high_season: {meaning: Wedding high season, rule: "month in (11, 12, 1, 2)"}
      is_valentine: {meaning: "Valentine's Day (from the calendar)", rule: "a holiday named 'Valentine''s Day' that day", from: [bronze.external.th_holidays.SUMMARY]}
      auspicious_level: {meaning: "Highest auspicious level that day, 'None' if not auspicious", rule: "max over date types (High > Medium > Low), else 'None'", from: [silver.auspicious_date.auspicious_level]}
      auspicious_types: {meaning: Date types that rate the day, rule: "string_agg(DISTINCT date_type, ', ')", from: [silver.auspicious_date.date_type]}
  - id: silver.channel
    layer: silver
    grain: one marketing channel.
    built_from: [bronze.crm]
    built_by: pipeline/silver/sql/10_channel.sql
    load: full rebuild each run (latest CRM snapshot)
    access: data team, ML job, warehouse load
    columns:
      channel_id: {meaning: Channel number, from: [crm.master.MarketingChannel.ChannelID]}
      channel_name: {meaning: Channel name, rule: trim(ChannelName), from: [crm.master.MarketingChannel.ChannelName]}
      channel_type: {meaning: Online or Offline, from: [crm.master.MarketingChannel.ChannelType]}
      platform: {meaning: Chat platform, from: [crm.master.MarketingChannel.Platform]}
      tracking_code: {meaning: Pre-typed tracking code, from: [crm.master.MarketingChannel.TrackingCode]}
      status: {meaning: Active or not, from: [crm.master.MarketingChannel.Status]}
  - id: silver.package
