# =====================================================================================================================
# GOLD (aisleco_dw.gold). Silver is first copied unchanged into schema stg (pipeline/warehouse/load.py load_stg,
# truncate and reload), so "from: silver.x.y" below means stg.x.y in the SQL. Ratios are never stored here.
# Access: aisleco_data only (the marts reach Gold through their views).
# =====================================================================================================================
  - id: gold.DimDate
    layer: gold
    grain: one calendar day 2022-2028, plus the Unknown member (DateKey −1).
    built_from: [silver.calendar_day]
    built_by: pipeline/warehouse/sql/10_dims.sql
    load: "upsert on DateKey; a row is rewritten only when a holiday, Lent or auspicious value changed (IS DISTINCT FROM)"
    access: aisleco_data
    role_playing: "inquiry, first reply, consultation, quote, closed, booking, requested wedding, last activity, wedding, cancellation, week start, activity, score date, forecast date, target week"
    columns:
      DateKey: {meaning: "Surrogate key YYYYMMDD; −1 = unknown / stage not reached", rule: "gold.dk(date) = to_char(date, 'YYYYMMDD')::int, −1 when null", from: [silver.calendar_day.date]}
      FullDate: {meaning: The day, from: [silver.calendar_day.date]}
      WeekStart: {meaning: Monday of the week, from: [silver.calendar_day.week_start]}
      WeekStartKey: {meaning: DateKey of the Monday, rule: gold.dk(week_start), from: [silver.calendar_day.week_start]}
      IsoYear: {meaning: ISO year, from: [silver.calendar_day.iso_year]}
      IsoWeek: {meaning: ISO week, from: [silver.calendar_day.iso_week]}
      Year: {meaning: Year, from: [silver.calendar_day.year]}
      Quarter: {meaning: Quarter 1-4, rule: "(month − 1) / 3 + 1", from: [silver.calendar_day.month]}
      Month: {meaning: Month 1-12, from: [silver.calendar_day.month]}
      MonthName: {meaning: "Jan..Dec", rule: "to_char(date, 'Mon')", from: [silver.calendar_day.date]}
      YearMonth: {meaning: "Month label YYYY-MM (the month grain of every monthly KPI)", rule: "to_char(date, 'YYYY-MM')", from: [silver.calendar_day.date]}
      DayName: {meaning: "Mon..Sun", rule: "to_char(date, 'Dy')", from: [silver.calendar_day.date]}
      IsWeekend: {meaning: Saturday or Sunday, from: [silver.calendar_day.is_weekend]}
      IsHighSeason: {meaning: "November to February", from: [silver.calendar_day.is_high_season]}
      IsBuddhistLent: {meaning: Inside Buddhist Lent, from: [silver.calendar_day.is_buddhist_lent]}
      LentSource: {meaning: ics or approximated, from: [silver.calendar_day.lent_source]}
      IsPublicHoliday: {meaning: Public holiday, from: [silver.calendar_day.is_public_holiday]}
      HolidayName: {meaning: Holiday names, from: [silver.calendar_day.holiday_name]}
      IsValentine: {meaning: "Valentine's Day", from: [silver.calendar_day.is_valentine]}
      AuspiciousLevel: {meaning: "High, Medium, Low or None", rule: "coalesce(auspicious_level, 'None')", from: [silver.calendar_day.auspicious_level]}
      AuspiciousTypes: {meaning: Date types rating the day, from: [silver.calendar_day.auspicious_types]}
      SeasonLabel: {meaning: "Buddhist Lent, High season or Regular", rule: "CASE WHEN is_buddhist_lent THEN 'Buddhist Lent' WHEN is_high_season THEN 'High season' ELSE 'Regular'", from: [silver.calendar_day.is_buddhist_lent, silver.calendar_day.is_high_season]}
  - id: gold.DimChannel
    layer: gold
    grain: one marketing channel (Type 1), plus Unknown (−1).
    built_from: [silver.channel]
    built_by: pipeline/warehouse/sql/10_dims.sql
    load: "upsert on ChannelID (Type 1: values overwritten when they change); surrogate key never changes"
    access: aisleco_data
    role_playing: inquiry channel, booking channel, activity channel, score channel
    columns:
      ChannelKey: {meaning: Surrogate key (identity)}
      ChannelID: {meaning: CRM channel id (kept for tracing), from: [silver.channel.channel_id]}
      ChannelName: {meaning: Channel name, from: [silver.channel.channel_name]}
      ChannelType: {meaning: Online or Offline, from: [silver.channel.channel_type]}
      Platform: {meaning: "Chat platform; 'in person' for offline", rule: "coalesce(platform, 'in person')", from: [silver.channel.platform]}
      TrackingCode: {meaning: Tracking code, from: [silver.channel.tracking_code]}
  - id: gold.DimPackage
    layer: gold
    grain: one package price version (Type 1; each price version is its own row in the CRM), plus Unknown (−1).
    built_from: [silver.package]
    built_by: pipeline/warehouse/sql/10_dims.sql
    load: upsert on PackageID with change detection
    access: aisleco_data
    role_playing: package of interest, package booked
    columns:
      PackageKey: {meaning: Surrogate key (identity)}
      PackageID: {meaning: CRM package id, from: [silver.package.package_id]}
      PackageName: {meaning: Package name, from: [silver.package.package_name]}
      PackageFamily: {meaning: Package across its price versions (the label on the dashboards), from: [silver.package.package_family]}
      PackageType: {meaning: "Full, Partial, DayOf, Custom", from: [silver.package.package_type]}
      FeeType: {meaning: Fixed or Percent, from: [silver.package.fee_type]}
      BasePrice: {meaning: Fixed fee THB, from: [silver.package.base_price]}
      FeeRate: {meaning: Fee % of budget, from: [silver.package.fee_rate]}
      EffectiveFrom: {meaning: Price valid from, from: [silver.package.effective_from]}
      EffectiveTo: {meaning: Price valid to, from: [silver.package.effective_to]}
  - id: gold.DimEmployee
    layer: gold
    grain: "one employee contract version (SCD Type 2), plus Unknown (−1). A fact on day d joins the version with ValidFrom <= d <= ValidTo."
    built_from: [silver.employee_contract]
    built_by: pipeline/warehouse/sql/10_dims.sql
    load: "SCD Type 2 upsert on ContractID: a new contract = a new row with a new key; a contract's own row is updated only when HR corrects it (ValidTo, IsCurrent, hours or role changed)"
    access: aisleco_data
    role_playing: staff on an assignment, first responder, sales owner, salesperson on an activity
    columns:
      EmployeeKey: {meaning: "Surrogate key: one per contract version"}
      ContractID: {meaning: CRM contract id (natural key of the version), from: [silver.employee_contract.contract_id]}
      EmployeeID: {meaning: CRM staff id (same for all versions of a person), from: [silver.employee_contract.employee_id]}
      EmployeeCode: {meaning: Staff code, from: [silver.employee_contract.employee_code]}
      Nickname: {meaning: Nickname, from: [silver.employee_contract.nickname]}
      RoleName: {meaning: Role in this version, from: [silver.employee_contract.role_name]}
      RoleGroup: {meaning: "Planning, Wedding day, Sales or Office", from: [silver.employee_contract.role_group]}
      EmploymentType: {meaning: "FullTime, PartTime, Freelance", from: [silver.employee_contract.employment_type]}
      StandardWeeklyHours: {meaning: "Contracted hours per week in this version (the capacity of every week the version covers)", from: [silver.employee_contract.standard_weekly_hours]}
      MaxConcurrentEvents: {meaning: Weddings per week the person can run, from: [silver.employee_contract.max_concurrent_events]}
      ValidFrom: {meaning: First day of the version, from: [silver.employee_contract.effective_from]}
      ValidTo: {meaning: "Last day (9999-12-31 if open)", rule: "coalesce(effective_to, DATE '9999-12-31')", from: [silver.employee_contract.effective_to]}
      IsCurrent: {meaning: Version valid on the run date, rule: "run as-of date BETWEEN effective_from AND coalesce(effective_to, 9999-12-31)", from: [silver.employee_contract.effective_from, silver.employee_contract.effective_to]}
  - id: gold.DimInquiryOutcome
    layer: gold
    grain: "one combination of outcome labels (junk dimension, about 25 rows), plus Unknown (−1)."
    built_from: [silver.inquiry, silver.event]
    built_by: pipeline/warehouse/sql/20_fact_inquiry.sql
    load: "insert new combinations only (ON CONFLICT DO NOTHING)"
    access: aisleco_data
    columns:
      OutcomeKey: {meaning: Surrogate key (identity)}
      Outcome: {meaning: "Open, Booked, Lost or Closed", rule: "Booked if booked_at (own or sibling booking) is set; Lost if status = 'Lost'; Open if closed_at is null; else Closed", from: [silver.event.booked_at, silver.inquiry.status, silver.inquiry.closed_at]}
      FurthestStage: {meaning: "New, Contacted, Consulted, Quoted, Booked", rule: "Booked if booked; Quoted if quoted_at; Consulted if consultation_at; Contacted if contacted_at or a staff reply; else New", from: [silver.event.booked_at, silver.inquiry.quoted_at, silver.inquiry.consultation_at, silver.inquiry.contacted_at, silver.inquiry.first_staff_reply_at]}
      ClosedBy: {meaning: "Sales, AutoRule or N/A", rule: "'Sales' when Booked; else coalesce(closed_by, 'N/A')", from: [silver.inquiry.closed_by]}
      LostReason: {meaning: "Reason when Lost, else N/A", rule: "CASE WHEN outcome = 'Lost' THEN coalesce(lost_reason, 'N/A') ELSE 'N/A'", from: [silver.inquiry.lost_reason]}
  - id: gold.FactInquiry
    layer: gold
    grain: "one inquiry (accumulating snapshot: milestone dates fill in as the inquiry moves on)."
    built_from: [silver.inquiry, silver.event, silver.chat_message, silver.sales_activity, gold.DimChannel, gold.DimPackage, gold.DimEmployee, gold.DimInquiryOutcome]
    built_by: pipeline/warehouse/sql/20_fact_inquiry.sql
    load: "built in work.FactInquiry, then merged on InquiryID with change detection (insert new, update changed rows only, delete rows whose inquiry is gone)"
    access: aisleco_data
    columns:
      InquiryID: {meaning: Inquiry number (degenerate dimension), from: [silver.inquiry.inquiry_id]}
      CustomerID: {meaning: The couple (pseudonymous; degenerate), from: [silver.inquiry.customer_id]}
      InquiryDateKey: {meaning: Date the couple got in touch, rule: "gold.dk(inquiry_at::date)", from: [silver.inquiry.inquiry_at]}
      FirstReplyDateKey: {meaning: "Date of the first staff reply (−1 none)", rule: "gold.dk(first_staff_reply_at::date)", from: [silver.inquiry.first_staff_reply_at]}
      ConsultationDateKey: {meaning: "Consultation date (−1 not reached)", rule: "gold.dk(consultation_at::date)", from: [silver.inquiry.consultation_at]}
      QuoteDateKey: {meaning: "Quote date (−1)", rule: "gold.dk(quoted_at::date)", from: [silver.inquiry.quoted_at]}
      ClosedDateKey: {meaning: "Closing date (−1 while open)", rule: "gold.dk(closed_at::date)", from: [silver.inquiry.closed_at]}
      BookingDateKey: {meaning: "Booking date (−1 not booked)", rule: "gold.dk(booked_at::date), booked_at = coalesce(own event's booked_at, earliest booking of a later inquiry of the same CustomerID within 120 days)", from: [silver.event.booked_at, silver.event.inquiry_id, silver.inquiry.customer_id, silver.inquiry.inquiry_at]}
      RequestedEventDateKey: {meaning: "Wedding date asked for (−1 not given)", rule: gold.dk(requested_event_date), from: [silver.inquiry.requested_event_date]}
      LastActivityDateKey: {meaning: Last sign of life of the couple, rule: "gold.dk(greatest(last_customer_msg_at, consultation_at, inquiry_at)::date)", from: [silver.inquiry.last_customer_msg_at, silver.inquiry.consultation_at, silver.inquiry.inquiry_at]}
      ChannelKey: {meaning: Channel, rule: "DimChannel on channel_id, −1 if none", from: [silver.inquiry.channel_id, gold.DimChannel.ChannelKey]}
      IndicativePackageKey: {meaning: Package of interest, rule: "DimPackage on indicative_package_id, −1", from: [silver.inquiry.indicative_package_id, gold.DimPackage.PackageKey]}
      FirstResponderKey: {meaning: Staff member who sent the first reply (contract version valid that day), rule: "employee_id of the staff message sent at first_staff_reply_at → DimEmployee version valid on that date, −1", from: [silver.chat_message.employee_id, silver.inquiry.first_staff_reply_at, gold.DimEmployee.EmployeeKey]}
      SalesOwnerKey: {meaning: Lead owner (version valid on the inquiry date), rule: "DimEmployee on sales_owner_id AND inquiry date BETWEEN ValidFrom AND ValidTo, −1", from: [silver.inquiry.sales_owner_id, gold.DimEmployee.EmployeeKey]}
      OutcomeKey: {meaning: Outcome labels, rule: "DimInquiryOutcome on (Outcome, FurthestStage, ClosedBy, LostReason)", from: [gold.DimInquiryOutcome.OutcomeKey]}
      BudgetBand: {meaning: Budget band (degenerate), from: [silver.inquiry.budget_band]}
      ResponseBand: {meaning: "Reply-speed band (degenerate)", from: [silver.inquiry.response_band]}
      FirstMessageHour: {meaning: "Hour 0-23 of the first message (degenerate)", from: [silver.inquiry.first_msg_hour]}
      InquiryCount: {meaning: 1 per inquiry, rule: "1", additivity: additive}
      IsReplied: {meaning: "1 if a person replied (or met the couple in person)", rule: "(first_staff_reply_at IS NOT NULL OR response_band = 'in person')::int", from: [silver.inquiry.first_staff_reply_at, silver.inquiry.response_band], additivity: additive}
      IsConsulted: {meaning: 1 if a consultation took place, rule: "(consultation_at IS NOT NULL)::int", from: [silver.inquiry.consultation_at], additivity: additive}
      IsQuoted: {meaning: 1 if quoted, rule: "(quoted_at IS NOT NULL)::int", from: [silver.inquiry.quoted_at], additivity: additive}
      IsBooked: {meaning: "1 if the couple booked (own inquiry or a later one of the same couple within 120 days); a later cancellation does not change it", rule: "(booked_at IS NOT NULL)::int", from: [silver.event.booked_at, silver.event.inquiry_id, silver.inquiry.customer_id], additivity: additive}
      IsOpen: {meaning: 1 while undecided, rule: "(outcome = 'Open')::int: not booked, not Lost, closed_at null", from: [silver.inquiry.closed_at, silver.inquiry.status, silver.event.booked_at], additivity: additive}
      IsAutoClosed: {meaning: 1 if closed by the 30-day no-reply rule, rule: "(outcome = 'Lost' AND closed_by = 'AutoRule')::int", from: [silver.inquiry.closed_by, silver.inquiry.status], additivity: additive}
      IsHoldout: {meaning: "1 if in the model's random 10 % holdout group, fixed at arrival", rule: "gold.is_holdout(InquiryID) = (first 7 hex digits of md5(id)) mod 10 = 0", from: [silver.inquiry.inquiry_id], additivity: additive}
      ResponseMinutes: {meaning: Minutes to the first staff reply, from: [silver.inquiry.response_minutes], additivity: "non-additive (use the median)"}
      DaysToConsult: {meaning: Days from inquiry to consultation, rule: "consultation_at::date − inquiry_at::date", from: [silver.inquiry.consultation_at, silver.inquiry.inquiry_at], additivity: "non-additive (median)"}
      DaysToQuote: {meaning: Days to quote, rule: "quoted_at::date − inquiry_at::date", from: [silver.inquiry.quoted_at, silver.inquiry.inquiry_at], additivity: "non-additive (median)"}
      DaysToClose: {meaning: Days to closing, rule: "closed_at::date − inquiry_at::date", from: [silver.inquiry.closed_at, silver.inquiry.inquiry_at], additivity: "non-additive (median)"}
      DaysToBook: {meaning: Days to booking (sales cycle), rule: "booked_at::date − inquiry_at::date", from: [silver.event.booked_at, silver.inquiry.inquiry_at], additivity: "non-additive (median)"}
      LeadDays: {meaning: Days from inquiry to the requested wedding date, rule: "requested_event_date − inquiry_at::date", from: [silver.inquiry.requested_event_date, silver.inquiry.inquiry_at], additivity: non-additive}
      QuotedAmount: {meaning: Quoted fee THB, from: [silver.inquiry.quoted_amount], additivity: "additive (its ratio to the budget is computed in the marts only)"}
      BudgetMidpoint: {meaning: Budget band midpoint THB, from: [silver.inquiry.budget_midpoint_thb], additivity: additive}
      CustomerMessages: {meaning: Messages from the couple, from: [silver.inquiry.customer_msgs], additivity: additive}
      StaffMessages: {meaning: Messages from staff, from: [silver.inquiry.staff_msgs], additivity: additive}
      FollowUps: {meaning: Logged follow-ups on the inquiry, rule: "count(*) of sales_activity for the inquiry", from: [silver.sales_activity.inquiry_id], additivity: additive}
  - id: gold.FactEventBooking
    layer: gold
    grain: one booked wedding (transaction fact).
    built_from: [silver.event, silver.inquiry, silver.assignment, gold.DimPackage, gold.DimChannel]
    built_by: pipeline/warehouse/sql/21_fact_event_booking.sql
    load: "built in work, merged on EventID with change detection"
    access: aisleco_data
    columns:
      EventID: {meaning: Wedding number (degenerate), from: [silver.event.event_id]}
      InquiryID: {meaning: Inquiry it came from, from: [silver.event.inquiry_id]}
      CustomerID: {meaning: The couple, from: [silver.event.customer_id]}
      BookingDateKey: {meaning: Booking (signing) date, rule: "gold.dk(booked_at::date)", from: [silver.event.booked_at]}
      EventDateKey: {meaning: Wedding date, rule: gold.dk(event_date), from: [silver.event.event_date]}
      CancelledDateKey: {meaning: "Cancellation date (−1 not cancelled)", rule: "gold.dk(cancelled_at::date)", from: [silver.event.cancelled_at]}
      PackageKey: {meaning: Package booked, rule: "DimPackage on package_id, −1", from: [silver.event.package_id, gold.DimPackage.PackageKey]}
      ChannelKey: {meaning: "The inquiry's channel; Walk-in if the booking has no inquiry", rule: "coalesce(DimChannel of the inquiry's channel_id, key of 'Walk-in', −1)", from: [silver.inquiry.channel_id, gold.DimChannel.ChannelKey]}
      ComplexityLevel: {meaning: "Low, Medium, High (degenerate)", from: [silver.event.complexity_level]}
      GuestBand: {meaning: "< 250, 250–449, 450+", rule: "CASE WHEN guest_count < 250 THEN '< 250' WHEN < 450 THEN '250–449' ELSE '450+'", from: [silver.event.guest_count]}
      GuestCount: {meaning: Guests, from: [silver.event.guest_count], additivity: additive}
      AgreedFee: {meaning: Agreed planning fee THB, from: [silver.event.agreed_fee], additivity: additive}
      StaffCount: {meaning: Distinct staff on the wedding, rule: "count(DISTINCT employee_id) of Active assignments", from: [silver.assignment.employee_id, silver.assignment.status], additivity: additive}
      PlannedHoursTotal: {meaning: Total staff hours planned, rule: "Σ workload_hours of Active assignments", from: [silver.assignment.workload_hours, silver.assignment.status], additivity: additive}
      PlanningHours: {meaning: Planning hours, rule: "Σ planning_hours of Active assignments", from: [silver.assignment.planning_hours], additivity: additive}
      EventDayHours: {meaning: Wedding-day hours, rule: "Σ event_day_hours of Active assignments", from: [silver.assignment.event_day_hours], additivity: additive}
      BookingLeadDays: {meaning: Days from booking to wedding, from: [silver.event.booking_lead_days], additivity: non-additive}
      IsCancelled: {meaning: 1 if cancelled, rule: is_cancelled::int, from: [silver.event.is_cancelled], additivity: additive}
  - id: gold.FactStaffWorkload
    layer: gold
    grain: "one employee × wedding × week: an assignment's hours placed in the weeks they are worked."
    built_from: [silver.assignment, silver.event, gold.DimEmployee]
    built_by: pipeline/warehouse/sql/22_fact_staff_workload.sql
    load: "built in work, merged on (AssignmentID, WeekStartDateKey) with change detection; hours unrounded so they are conserved exactly (check C03)"
    access: aisleco_data
    rule: "Hours-spread rule (Spec 03 §4.3). Wedding-day hours in the wedding week. Planning hours from the week of assigned_at_effective to the week before the wedding, n weeks: n <= 10 → planning / n each week; n > 10 → 20 % over the first 2 weeks, 50 % over the last 8, 30 % evenly over the n − 10 between. Assigned in the wedding week or later → all hours in the wedding week. Cancelled wedding → weeks from the cancellation week on are dropped."
    columns:
      AssignmentID: {meaning: Assignment (degenerate), from: [silver.assignment.assignment_id]}
      WeekStartDateKey: {meaning: Monday of the week the hours fall in, rule: "gold.dk(aw + 7 × (k − 1)) for planning week k, or the wedding week", from: [silver.assignment.assigned_at_effective, silver.event.event_date]}
      EmployeeKey: {meaning: "Staff contract version valid on that Monday (if a contract starts mid-week: the version valid at the wedding)", rule: "DimEmployee on employee_id AND week BETWEEN ValidFrom AND ValidTo, else the version valid on the wedding date, else −1", from: [silver.assignment.employee_id, gold.DimEmployee.EmployeeKey]}
      EventID: {meaning: The wedding (degenerate), from: [silver.assignment.event_id]}
      EventDateKey: {meaning: Wedding date, rule: gold.dk(event_date), from: [silver.event.event_date]}
      AssignmentRole: {meaning: Role on the wedding, from: [silver.assignment.assignment_role]}
      PlanningHours: {meaning: Planning hours placed in this week, rule: "n <= 10: planning_hours / n; n > 10: k <= 2 → planning_hours × 0.2 / 2; k > n − 8 → × 0.5 / 8; else × 0.3 / (n − 10); n = 0 → all in the wedding week", from: [silver.assignment.planning_hours, silver.assignment.assigned_at_effective, silver.event.event_date, silver.event.cancelled_at], additivity: additive}
      EventDayHours: {meaning: Wedding-day hours (wedding week only), rule: "event_day_hours in the wedding week, 0 in planning weeks; dropped if the wedding was cancelled before its week", from: [silver.assignment.event_day_hours, silver.event.cancelled_at], additivity: additive}
      TotalHours: {meaning: All hours of this assignment in this week, rule: "PlanningHours + EventDayHours", from: [gold.FactStaffWorkload.PlanningHours, gold.FactStaffWorkload.EventDayHours], additivity: additive}
  - id: gold.FactSalesActivity
    layer: gold
    grain: one logged follow-up (transaction fact).
    built_from: [silver.sales_activity, silver.inquiry, gold.DimEmployee, gold.DimChannel, gold.FactLeadScore]
    built_by: pipeline/warehouse/sql/23_fact_sales_activity.sql
    load: "built in work, merged on ActivityID with change detection"
    access: aisleco_data
    columns:
      ActivityID: {meaning: Follow-up number, from: [silver.sales_activity.activity_id]}
      ActivityDateKey: {meaning: Date of the follow-up, rule: "gold.dk(activity_at::date)", from: [silver.sales_activity.activity_at]}
      SalespersonKey: {meaning: Salesperson (version valid that day), rule: "DimEmployee on employee_id and date, −1", from: [silver.sales_activity.employee_id, gold.DimEmployee.EmployeeKey]}
      ChannelKey: {meaning: Channel of the inquiry, from: [silver.inquiry.channel_id, gold.DimChannel.ChannelKey]}
      InquiryID: {meaning: Inquiry (degenerate), from: [silver.sales_activity.inquiry_id]}
      ActivityType: {meaning: "Call, LINE, Meeting", from: [silver.sales_activity.activity_type]}
      Outcome: {meaning: Result, from: [silver.sales_activity.outcome]}
      FromCallList: {meaning: 1 if made from the daily call list, rule: on_call_list::int, from: [silver.sales_activity.on_call_list], additivity: additive}
      ListRank: {meaning: "The lead's rank on that day's list (null if not listed)", rule: "FactLeadScore.Rank where ScoreDateKey = gold.dk(list_date)", from: [gold.FactLeadScore.Rank, silver.sales_activity.list_date]}
      IsHoldout: {meaning: Lead in the holdout group, rule: gold.is_holdout(inquiry_id), from: [silver.sales_activity.inquiry_id], additivity: additive}
      ActivityCount: {meaning: 1 per follow-up, rule: "1", additivity: additive}
  - id: gold.FactLeadScore
    layer: gold
    grain: one open inquiry per score date (periodic snapshot written by the conversion model).
    built_from: [feature.lead_features, silver.inquiry, silver.package, silver.event, gold.DimChannel, gold.DimEmployee]
    built_by: "ml/score.py (champion model from the MLflow registry)"
    load: "daily: delete the score date's rows, insert the new scores (idempotent)"
    access: aisleco_data
    columns:
      ScoreDateKey: {meaning: Score date (the run's as-of date), rule: gold.dk(asof)}
      InquiryID: {meaning: Open inquiry scored, rule: "inquiries with inquiry_at < as-of and not closed before it", from: [silver.inquiry.inquiry_id]}
      ChannelKey: {meaning: Channel, from: [feature.lead_features.channel, gold.DimChannel.ChannelKey]}
      SalesOwnerKey: {meaning: Lead owner (version valid on the score date), from: [silver.inquiry.sales_owner_id, gold.DimEmployee.EmployeeKey]}
      ModelVersion: {meaning: "Model version (v<registry version>)"}
      Probability: {meaning: Chance the couple books within 60 days, rule: "champion model predict_proba(features at today 00:00)", from: [feature.lead_features.inquiry_id], additivity: "non-additive (but Σ probabilities = expected bookings)"}
      ExpectedFee: {meaning: Probability × the fee we would earn, rule: "Probability × fee; fee = budget_midpoint_thb × Full Planning fee_rate / 100 for Full; base_price of the current version for Partial and DayOf; else the median agreed_fee of non-cancelled bookings in the last 365 days", from: [gold.FactLeadScore.Probability, silver.inquiry.budget_midpoint_thb, silver.package.fee_rate, silver.package.base_price, silver.event.agreed_fee], additivity: "additive as an expectation"}
      Rank: {meaning: "Position on the owner's list, by ExpectedFee (holdout leads are not ranked)", rule: "rank(ExpectedFee DESC) within sales owner, holdout excluded", from: [gold.FactLeadScore.ExpectedFee, gold.FactLeadScore.IsHoldout]}
      Band: {meaning: "High, Medium, Low", rule: "Probability against the model's stored high and medium thresholds", from: [gold.FactLeadScore.Probability]}
      IsHoldout: {meaning: In the holdout group, rule: "same md5 rule as gold.is_holdout", from: [silver.inquiry.inquiry_id], additivity: additive}
      Reason1: {meaning: "Top reason, in plain words, from the SHAP contributions"}
      Reason2: {meaning: Second reason}
      Reason3: {meaning: Third reason}
      NextBestAction: {meaning: Suggested next step for the salesperson (rules on stage, reasons and the date badge)}
  - id: gold.FactDemandForecast
    layer: gold
    grain: one forecast date × target week × role group (periodic snapshot written by the demand forecast).
    built_from: [gold.FactStaffWorkload, gold.DimEmployee, silver.inquiry, silver.event, silver.calendar_day]
    built_by: ml/forecast.py
    load: "delete the forecast date's rows, insert 26 weeks × 2 role groups"
    access: aisleco_data
    columns:
      ForecastDateKey: {meaning: Date the forecast was made, rule: gold.dk(asof)}
      TargetWeekDateKey: {meaning: Monday of the forecast week (1-26 weeks ahead)}
      RoleGroup: {meaning: Planning or Wedding day, from: [gold.DimEmployee.RoleGroup]}
      BookedHours: {meaning: Hours of weddings already booked before the forecast date, rule: "Σ FactStaffWorkload.TotalHours of weddings booked before t, by week and role group", from: [gold.FactStaffWorkload.TotalHours, silver.event.booked_at], additivity: "additive across role groups, never across forecast dates"}
      PipelineHours: {meaning: Expected hours from open inquiries with a requested date, rule: "Σ over open inquiries of (booking rate of their stage and channel, measured on inquiries decided before t) × average hours profile of a wedding of that package, placed relative to the requested week", from: [silver.inquiry.requested_event_date, silver.inquiry.quoted_at, silver.inquiry.consultation_at, gold.FactStaffWorkload.TotalHours], additivity: "additive across role groups"}
      NewBookingHours: {meaning: Hours from bookings not yet in sight, rule: "max(0, P50 − booked − pipeline)", from: [gold.FactDemandForecast.P50Hours, gold.FactDemandForecast.BookedHours, gold.FactDemandForecast.PipelineHours], additivity: "additive across role groups"}
      P10Hours: {meaning: Low end of the forecast (10 %), rule: "max(booked, P50 × (1 + 10th percentile of the backtest relative error for the horizon bucket))", from: [gold.FactDemandForecast.P50Hours], additivity: non-additive}
      P50Hours: {meaning: "Central forecast of hours to be worked", rule: "booked + pipeline + LightGBM quantile (0.5) prediction of the pickup, or the baseline that won the 5-12-week backtest", from: [gold.FactDemandForecast.BookedHours, gold.FactDemandForecast.PipelineHours, silver.calendar_day.is_high_season], additivity: "additive across role groups"}
      P90Hours: {meaning: High end (90 %), rule: "max(P50, P50 × (1 + 90th percentile of backtest relative error))", from: [gold.FactDemandForecast.P50Hours], additivity: non-additive}
      CapacityHours: {meaning: Contracted hours of the role group that week, rule: "Σ DimEmployee.StandardWeeklyHours of the versions valid on the week's Monday", from: [gold.DimEmployee.StandardWeeklyHours], additivity: "additive across role groups"}
      ModelVersion: {meaning: "winner:mlflow run id"}
  - id: sales_pii.customer_contact
    layer: gold
    grain: one couple (display names for the Sales call list).
    built_from: [silver_restricted.customer_contact]
    built_by: pipeline/warehouse/load.py (load_stg)
    load: truncate and reload each run
    access: aisleco_sales and aisleco_data only
    columns:
      customer_id: {meaning: The couple, from: [silver_restricted.customer_contact.customer_id]}
      display_name: {meaning: Platform display name, from: [silver_restricted.customer_contact.display_name]}
      contact_first_name: {meaning: Primary contact first name, from: [silver_restricted.customer_contact.contact_first_name]}
      phone_masked: {meaning: Masked phone, from: [silver_restricted.customer_contact.phone_masked]}

# =====================================================================================================================
# MARTS (views; the mart step recreates them every run, then re-applies the grants in 90_grants.sql)
# =====================================================================================================================
  - id: mart_sales.v_inquiry
    layer: mart
    grain: one inquiry with its labels (base view for the other Sales and Executive views).
    built_from: [gold.FactInquiry, gold.DimDate, gold.DimChannel, gold.DimPackage, gold.DimInquiryOutcome, gold.DimEmployee]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_data
    copy_of: gold.FactInquiry
    columns:
      inquiry_date: {meaning: Date the couple got in touch, rule: DimDate(InquiryDateKey).FullDate, from: [gold.FactInquiry.InquiryDateKey, gold.DimDate.FullDate]}
      inquiry_month: {meaning: "Inquiry month YYYY-MM (the cohort)", rule: DimDate(InquiryDateKey).YearMonth, from: [gold.FactInquiry.InquiryDateKey, gold.DimDate.YearMonth]}
      channel: {meaning: Channel name, from: [gold.FactInquiry.ChannelKey, gold.DimChannel.ChannelName]}
      channel_type: {meaning: Online or Offline, from: [gold.DimChannel.ChannelType]}
      package_interest: {meaning: Package family of interest, from: [gold.FactInquiry.IndicativePackageKey, gold.DimPackage.PackageFamily]}
      outcome: {meaning: "Open, Booked, Lost, Closed", from: [gold.FactInquiry.OutcomeKey, gold.DimInquiryOutcome.Outcome]}
      furthest_stage: {meaning: Furthest stage reached, from: [gold.DimInquiryOutcome.FurthestStage]}
      closed_by: {meaning: "Sales, AutoRule, N/A", from: [gold.DimInquiryOutcome.ClosedBy]}
      lost_reason: {meaning: Lost reason, from: [gold.DimInquiryOutcome.LostReason]}
      requested_date: {meaning: Wedding date asked for, from: [gold.FactInquiry.RequestedEventDateKey, gold.DimDate.FullDate]}
      last_activity_date: {meaning: Last sign of life, from: [gold.FactInquiry.LastActivityDateKey, gold.DimDate.FullDate]}
      sales_owner: {meaning: Owner nickname, from: [gold.FactInquiry.SalesOwnerKey, gold.DimEmployee.Nickname]}
      sales_owner_id: {meaning: Owner staff id (the API filters a salesperson's own leads on it), from: [gold.DimEmployee.EmployeeID]}
  - id: mart_sales.v_today_list
    layer: mart
    grain: one open inquiry scored on the latest score date.
    built_from: [gold.FactLeadScore, mart_sales.v_inquiry, mart_ops.v_date_check]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_data (names joined from sales_pii by the API)
    columns:
      inquiry_id: {meaning: Inquiry, from: [gold.FactLeadScore.InquiryID]}
      customer_id: {meaning: The couple, from: [mart_sales.v_inquiry.CustomerID]}
      sales_owner_id: {meaning: Owner id, from: [mart_sales.v_inquiry.sales_owner_id]}
      sales_owner: {meaning: Owner nickname, from: [mart_sales.v_inquiry.sales_owner]}
      channel: {meaning: Channel, from: [mart_sales.v_inquiry.channel]}
      package_interest: {meaning: Package of interest, from: [mart_sales.v_inquiry.package_interest]}
      budget_band: {meaning: Budget band, from: [mart_sales.v_inquiry.BudgetBand]}
      requested_date: {meaning: Wedding date asked for, from: [mart_sales.v_inquiry.requested_date]}
      furthest_stage: {meaning: Furthest stage, from: [mart_sales.v_inquiry.furthest_stage]}
      inquiry_date: {meaning: Inquiry date, from: [mart_sales.v_inquiry.inquiry_date]}
      last_activity_date: {meaning: Last sign of life, from: [mart_sales.v_inquiry.last_activity_date]}
      days_silent: {meaning: Days since the last sign of life, rule: "gold.asof() − last_activity_date", from: [mart_sales.v_inquiry.last_activity_date]}
      auto_close_date: {meaning: Date the 30-day rule closes the lead, rule: "last_activity_date + 30", from: [mart_sales.v_inquiry.last_activity_date]}
      probability: {meaning: Chance to book within 60 days, from: [gold.FactLeadScore.Probability]}
      expected_fee: {meaning: Probability-weighted fee THB, from: [gold.FactLeadScore.ExpectedFee]}
      rank: {meaning: Position on the owner's list, from: [gold.FactLeadScore.Rank]}
      band: {meaning: "High, Medium, Low", from: [gold.FactLeadScore.Band]}
      holdout: {meaning: In the holdout group (standard queue), rule: "IsHoldout = 1", from: [gold.FactLeadScore.IsHoldout]}
      reason1: {meaning: Top reason, from: [gold.FactLeadScore.Reason1]}
      reason2: {meaning: Second reason, from: [gold.FactLeadScore.Reason2]}
      reason3: {meaning: Third reason, from: [gold.FactLeadScore.Reason3]}
      next_best_action: {meaning: Suggested next step, from: [gold.FactLeadScore.NextBestAction]}
      date_badge: {meaning: "Room, Tight or Full for the requested date", rule: "NULL if no date; Full if weddings_that_day >= 2 OR least(planning, wedding-day headroom) < 0; Tight if weddings_that_day = 1 OR least(...) < 20; else Room", from: [mart_ops.v_date_check.weddings_that_day, mart_ops.v_date_check.planning_headroom_hours, mart_ops.v_date_check.wedding_day_headroom_hours]}
      model_version: {meaning: Model version, from: [gold.FactLeadScore.ModelVersion]}
      score_date: {meaning: Score date, rule: "latest ScoreDateKey only", from: [gold.FactLeadScore.ScoreDateKey, gold.DimDate.FullDate]}
  - id: mart_sales.v_new_today
    layer: mart
    grain: one open inquiry that arrived since yesterday and has no first reply.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_data
    rule: "IsOpen = 1 AND IsReplied = 0 AND inquiry_date >= gold.asof() − 1"
    columns:
      inquiry_id: {meaning: Inquiry, from: [mart_sales.v_inquiry.InquiryID]}
      customer_id: {meaning: The couple, from: [mart_sales.v_inquiry.CustomerID]}
      sales_owner_id: {meaning: Owner id, from: [mart_sales.v_inquiry.sales_owner_id]}
      sales_owner: {meaning: Owner, from: [mart_sales.v_inquiry.sales_owner]}
      channel: {meaning: Channel, from: [mart_sales.v_inquiry.channel]}
      inquiry_date: {meaning: Inquiry date, from: [mart_sales.v_inquiry.inquiry_date]}
      package_interest: {meaning: Package of interest, from: [mart_sales.v_inquiry.package_interest]}
      budget_band: {meaning: Budget band, from: [mart_sales.v_inquiry.BudgetBand]}
  - id: mart_sales.v_going_cold
    layer: mart
    grain: one open inquiry silent for 10 to 29 days.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_data
    rule: "IsOpen = 1 AND gold.asof() − last_activity_date BETWEEN 10 AND 29"
    columns:
      inquiry_id: {meaning: Inquiry, from: [mart_sales.v_inquiry.InquiryID]}
      customer_id: {meaning: The couple, from: [mart_sales.v_inquiry.CustomerID]}
      sales_owner_id: {meaning: Owner id, from: [mart_sales.v_inquiry.sales_owner_id]}
      sales_owner: {meaning: Owner, from: [mart_sales.v_inquiry.sales_owner]}
      channel: {meaning: Channel, from: [mart_sales.v_inquiry.channel]}
      furthest_stage: {meaning: Furthest stage, from: [mart_sales.v_inquiry.furthest_stage]}
      last_activity_date: {meaning: Last sign of life, from: [mart_sales.v_inquiry.last_activity_date]}
      days_silent: {meaning: Days silent, rule: "gold.asof() − last_activity_date", from: [mart_sales.v_inquiry.last_activity_date]}
      auto_close_date: {meaning: Auto-close date, rule: "last_activity_date + 30", from: [mart_sales.v_inquiry.last_activity_date]}
  - id: mart_sales.v_my_week
    layer: mart
    grain: one Sales Executive (contract valid today).
    built_from: [gold.DimEmployee, mart_sales.v_inquiry, gold.DimDate]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_data
    columns:
      employee_id: {meaning: Salesperson id, from: [gold.DimEmployee.EmployeeID]}
      nickname: {meaning: Salesperson, from: [gold.DimEmployee.Nickname]}
      bookings_this_month: {meaning: Inquiries owned that booked this calendar month, rule: "count(*) of v_inquiry where sales_owner_id = employee AND DimDate(BookingDateKey).YearMonth = month of gold.asof()", from: [mart_sales.v_inquiry.BookingDateKey, mart_sales.v_inquiry.sales_owner_id, gold.DimDate.YearMonth]}
      median_first_reply_min_7d: {meaning: Median minutes to first reply, last 7 days, rule: "percentile_cont(0.5) of ResponseMinutes where inquiry_date > gold.asof() − 7", from: [mart_sales.v_inquiry.ResponseMinutes, mart_sales.v_inquiry.inquiry_date]}
  - id: mart_sales.v_funnel
    layer: mart
    grain: one inquiry month × channel.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      inquiry_month: {meaning: Inquiry month (cohort), from: [mart_sales.v_inquiry.inquiry_month]}
      channel: {meaning: Channel, from: [mart_sales.v_inquiry.channel]}
      inquiries: {meaning: Inquiries, rule: Σ InquiryCount, from: [mart_sales.v_inquiry.InquiryCount], additivity: additive}
      replied: {meaning: Replied, rule: Σ IsReplied, from: [mart_sales.v_inquiry.IsReplied], additivity: additive}
      consulted: {meaning: Consulted, rule: Σ IsConsulted, from: [mart_sales.v_inquiry.IsConsulted], additivity: additive}
      quoted: {meaning: Quoted, rule: Σ IsQuoted, from: [mart_sales.v_inquiry.IsQuoted], additivity: additive}
      booked: {meaning: Booked, rule: Σ IsBooked, from: [mart_sales.v_inquiry.IsBooked], additivity: additive}
      still_open: {meaning: Still undecided, rule: Σ IsOpen, from: [mart_sales.v_inquiry.IsOpen], additivity: additive}
  - id: mart_sales.v_conversion_by_channel_month
    layer: mart
    grain: one channel × inquiry month.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      channel: {meaning: Channel, from: [mart_sales.v_inquiry.channel]}
      inquiry_month: {meaning: Inquiry month, from: [mart_sales.v_inquiry.inquiry_month]}
      inquiries: {meaning: Inquiries, rule: Σ InquiryCount, from: [mart_sales.v_inquiry.InquiryCount], additivity: additive}
      decided: {meaning: Booked or lost (no longer open), rule: "Σ (InquiryCount − IsOpen)", from: [mart_sales.v_inquiry.InquiryCount, mart_sales.v_inquiry.IsOpen], additivity: additive}
      booked: {meaning: Booked, rule: Σ IsBooked, from: [mart_sales.v_inquiry.IsBooked], additivity: additive}
      conversion: {meaning: Share of decided couples who booked, rule: "booked / decided", from: [mart_sales.v_conversion_by_channel_month.booked, mart_sales.v_conversion_by_channel_month.decided], additivity: "non-additive (recompute from the sums)"}
      ci_low: {meaning: Lower end of the 95 % Wilson interval, rule: "((b + 1.92) − 1.96 × sqrt(b (d − b) / d + 0.96)) / (d + 3.84), b = booked, d = decided", from: [mart_sales.v_conversion_by_channel_month.booked, mart_sales.v_conversion_by_channel_month.decided]}
      ci_high: {meaning: Upper end of the 95 % Wilson interval, rule: "((b + 1.92) + 1.96 × sqrt(b (d − b) / d + 0.96)) / (d + 3.84)", from: [mart_sales.v_conversion_by_channel_month.booked, mart_sales.v_conversion_by_channel_month.decided]}
  - id: mart_sales.v_response_by_hour
    layer: mart
    grain: one hour of the day × weekday, online inquiries only.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      hour: {meaning: Hour of the first message, from: [mart_sales.v_inquiry.FirstMessageHour]}
      weekday: {meaning: "ISO weekday 1 = Monday", rule: "extract(isodow FROM inquiry_date)", from: [mart_sales.v_inquiry.inquiry_date]}
      inquiries: {meaning: Online inquiries, rule: "count(*) where channel_type = 'Online'", from: [mart_sales.v_inquiry.channel_type], additivity: additive}
      median_reply_min: {meaning: Median minutes to first reply, rule: "percentile_cont(0.5) of ResponseMinutes", from: [mart_sales.v_inquiry.ResponseMinutes], additivity: non-additive}
  - id: mart_sales.v_response_band
    layer: mart
    grain: one reply-speed band, all history.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      response_band: {meaning: Reply-speed band, from: [mart_sales.v_inquiry.ResponseBand]}
      inquiries: {meaning: Inquiries, rule: count(*), from: [mart_sales.v_inquiry.InquiryID], additivity: additive}
      decided: {meaning: Decided, rule: "Σ (InquiryCount − IsOpen)", from: [mart_sales.v_inquiry.InquiryCount, mart_sales.v_inquiry.IsOpen], additivity: additive}
      booked: {meaning: Booked, rule: Σ IsBooked, from: [mart_sales.v_inquiry.IsBooked], additivity: additive}
      consult_rate: {meaning: Share consulted, rule: "Σ IsConsulted / count(*)", from: [mart_sales.v_inquiry.IsConsulted]}
      conversion: {meaning: Share of decided that booked, rule: "Σ IsBooked / Σ (InquiryCount − IsOpen)", from: [mart_sales.v_inquiry.IsBooked, mart_sales.v_inquiry.InquiryCount, mart_sales.v_inquiry.IsOpen]}
      median_minutes: {meaning: Median minutes to first reply, rule: "percentile_cont(0.5) of ResponseMinutes", from: [mart_sales.v_inquiry.ResponseMinutes]}
  - id: mart_sales.v_lost_reasons
    layer: mart
    grain: one closing month × closed by × lost reason.
    built_from: [mart_sales.v_inquiry, gold.DimDate]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      closed_month: {meaning: Closing month, from: [mart_sales.v_inquiry.ClosedDateKey, gold.DimDate.YearMonth]}
      closed_by: {meaning: Sales or AutoRule, from: [mart_sales.v_inquiry.closed_by]}
      lost_reason: {meaning: Reason, from: [mart_sales.v_inquiry.lost_reason]}
      lost: {meaning: Couples lost, rule: "count(*) where outcome = 'Lost'", from: [mart_sales.v_inquiry.outcome], additivity: additive}
  - id: mart_sales.v_quote_share
    layer: mart
    grain: one quoted inquiry with a known budget.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      inquiry_id: {meaning: Inquiry, from: [mart_sales.v_inquiry.InquiryID]}
      inquiry_month: {meaning: Inquiry month, from: [mart_sales.v_inquiry.inquiry_month]}
      quote_share: {meaning: Quoted fee as a share of the budget midpoint, rule: "QuotedAmount / BudgetMidpoint (per couple)", from: [mart_sales.v_inquiry.QuotedAmount, mart_sales.v_inquiry.BudgetMidpoint], additivity: "non-additive (median per group)"}
      group_name: {meaning: "Booked, Lost on price, Lost other, Open", rule: "Booked if outcome Booked; 'Lost on price' if lost_reason = 'Price'; 'Lost, other' if Lost; else Open", from: [mart_sales.v_inquiry.outcome, mart_sales.v_inquiry.lost_reason]}
  - id: mart_sales.v_followup_compliance
    layer: mart
    grain: one salesperson × score day.
    built_from: [gold.FactLeadScore, gold.FactSalesActivity, gold.DimDate, gold.DimEmployee]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    columns:
      day: {meaning: Score (list) date, from: [gold.FactLeadScore.ScoreDateKey, gold.DimDate.FullDate]}
      salesperson: {meaning: Salesperson, from: [gold.FactLeadScore.SalesOwnerKey, gold.DimEmployee.Nickname]}
      listed: {meaning: Leads on the list, rule: "count(*) where IsHoldout = 0 AND Rank <= 15", from: [gold.FactLeadScore.Rank, gold.FactLeadScore.IsHoldout], additivity: additive}
      contacted: {meaning: Listed leads contacted that day from the list, rule: "count of listed leads with a FactSalesActivity row on the same day with FromCallList = 1", from: [gold.FactSalesActivity.FromCallList, gold.FactSalesActivity.ActivityDateKey, gold.FactSalesActivity.InquiryID], additivity: additive}
  - id: mart_sales.v_ab_result
    layer: mart
    grain: one arm of the A/B test (ranked list or holdout).
    built_from: [gold.FactLeadScore, gold.FactInquiry, gold.DimDate]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    rule: "each lead's first score; only leads first scored at least 60 days before gold.asof() (label matured)"
    columns:
      arm: {meaning: "Ranked list or Standard queue (holdout)", rule: "CASE WHEN IsHoldout = 1 THEN 'Standard queue (holdout)' ELSE 'Ranked list'", from: [gold.FactLeadScore.IsHoldout]}
      leads: {meaning: Leads in the arm, rule: count(*), from: [gold.FactLeadScore.InquiryID], additivity: additive}
      booked_60d: {meaning: Leads that booked within 60 days of their first score, rule: "Σ (booking date < first score date + 60)", from: [gold.FactInquiry.BookingDateKey, gold.FactLeadScore.ScoreDateKey], additivity: additive}
      booking_rate_60d: {meaning: Share booked within 60 days, rule: "avg(booked within 60 days)", from: [gold.FactInquiry.BookingDateKey, gold.FactLeadScore.ScoreDateKey]}
      from_date: {meaning: First score date in the arm, rule: min(first_score), from: [gold.FactLeadScore.ScoreDateKey]}
      to_date: {meaning: Last first-score date in the arm, rule: max(first_score), from: [gold.FactLeadScore.ScoreDateKey]}
  - id: mart_sales.v_ab_effect
    layer: mart
    grain: one row, the A/B effect so far.
    built_from: [mart_sales.v_ab_result]
    built_by: pipeline/marts/sql/20_mart_sales.sql
    load: view
    access: aisleco_sales, aisleco_exec, aisleco_data
    rule: "two-proportion normal approximation: effect ± 1.96 × sqrt(p1(1-p1)/n1 + p0(1-p0)/n0)"
    columns:
      ranked_leads: {meaning: Leads in the ranked-list arm, from: [mart_sales.v_ab_result.leads], additivity: additive}
      holdout_leads: {meaning: Leads in the holdout arm (standard queue), from: [mart_sales.v_ab_result.leads], additivity: additive}
      ranked_rate: {meaning: 60-day booking rate of ranked leads, from: [mart_sales.v_ab_result.booking_rate_60d]}
      holdout_rate: {meaning: 60-day booking rate of holdout leads, from: [mart_sales.v_ab_result.booking_rate_60d]}
      effect: {meaning: Extra 60-day booking rate from working the ranked list, rule: ranked_rate − holdout_rate, from: [mart_sales.v_ab_result.booking_rate_60d]}
      effect_ci_low: {meaning: Lower end of the 95 % interval of the effect, rule: "effect − 1.96 × standard error", from: [mart_sales.v_ab_result.booking_rate_60d, mart_sales.v_ab_result.leads]}
      effect_ci_high: {meaning: Upper end of the 95 % interval of the effect, rule: "effect + 1.96 × standard error", from: [mart_sales.v_ab_result.booking_rate_60d, mart_sales.v_ab_result.leads]}
  - id: mart_ops.v_capacity_grid
    layer: mart
    grain: "one employee (Planning and Wedding-day roles) × week with a valid contract, including weeks without work."
    built_from: [gold.DimDate, gold.DimEmployee, gold.FactStaffWorkload]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    columns:
      week_start: {meaning: Monday of the week, from: [gold.DimDate.WeekStart]}
      employee_id: {meaning: Staff id, from: [gold.DimEmployee.EmployeeID]}
      employee_key: {meaning: Contract version valid that week, rule: "DimEmployee where week_start BETWEEN ValidFrom AND ValidTo", from: [gold.DimEmployee.EmployeeKey]}
      nickname: {meaning: Nickname, from: [gold.DimEmployee.Nickname]}
      role_name: {meaning: Role, from: [gold.DimEmployee.RoleName]}
      role_group: {meaning: Planning or Wedding day, from: [gold.DimEmployee.RoleGroup]}
      employment_type: {meaning: Employment type, from: [gold.DimEmployee.EmploymentType]}
      capacity_hours: {meaning: Contracted hours that week (SCD2 version valid on the Monday), from: [gold.DimEmployee.StandardWeeklyHours], additivity: additive}
      max_concurrent: {meaning: Weddings per week the contract allows, from: [gold.DimEmployee.MaxConcurrentEvents]}
      assigned_hours: {meaning: Hours of work that week, rule: "Σ FactStaffWorkload.TotalHours by WeekStart and EmployeeID (0 if none)", from: [gold.FactStaffWorkload.TotalHours], additivity: additive}
      planning_hours: {meaning: Planning part, rule: Σ PlanningHours, from: [gold.FactStaffWorkload.PlanningHours], additivity: additive}
      event_day_hours: {meaning: Wedding-day part, rule: Σ EventDayHours, from: [gold.FactStaffWorkload.EventDayHours], additivity: additive}
      weddings: {meaning: Weddings worked on the day that week, rule: "count(DISTINCT EventID) with EventDayHours > 0", from: [gold.FactStaffWorkload.EventID, gold.FactStaffWorkload.EventDayHours], additivity: additive}
      active_weddings: {meaning: Weddings with any hours that week (planning included), rule: count(DISTINCT EventID), from: [gold.FactStaffWorkload.EventID]}
      utilization: {meaning: Share of contracted hours booked, rule: "assigned_hours / capacity_hours", from: [mart_ops.v_capacity_grid.assigned_hours, mart_ops.v_capacity_grid.capacity_hours], additivity: "non-additive (for groups: Σ assigned / Σ capacity)"}
      overtime_hours: {meaning: Hours above contract, rule: "greatest(0, assigned_hours − capacity_hours)", from: [mart_ops.v_capacity_grid.assigned_hours, mart_ops.v_capacity_grid.capacity_hours], additivity: "additive (computed per person-week first)"}
      over_concurrency: {meaning: More weddings than the contract allows, rule: "weddings > max_concurrent", from: [mart_ops.v_capacity_grid.weddings, mart_ops.v_capacity_grid.max_concurrent]}
      status: {meaning: "Over, Tight, OK, Quiet", rule: "assigned >= capacity → Over; >= 0.85 × capacity → Tight; >= 0.5 × → OK; else Quiet", from: [mart_ops.v_capacity_grid.assigned_hours, mart_ops.v_capacity_grid.capacity_hours]}
  - id: mart_ops.v_week_detail
    layer: mart
    grain: one employee × week × wedding (the weddings behind one heatmap cell).
    built_from: [gold.FactStaffWorkload, gold.DimDate, gold.DimEmployee, gold.FactEventBooking, gold.DimPackage]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    columns:
      week_start: {meaning: Week, from: [gold.FactStaffWorkload.WeekStartDateKey, gold.DimDate.WeekStart]}
      employee_id: {meaning: Staff id, from: [gold.DimEmployee.EmployeeID]}
      nickname: {meaning: Nickname, from: [gold.DimEmployee.Nickname]}
      event_id: {meaning: Wedding, from: [gold.FactStaffWorkload.EventID]}
      event_date: {meaning: Wedding date, from: [gold.FactStaffWorkload.EventDateKey, gold.DimDate.FullDate]}
      package: {meaning: Package family, from: [gold.FactEventBooking.PackageKey, gold.DimPackage.PackageFamily]}
      guests: {meaning: Guests, from: [gold.FactEventBooking.GuestCount]}
      complexity: {meaning: Complexity, from: [gold.FactEventBooking.ComplexityLevel]}
      role: {meaning: Role on the wedding, from: [gold.FactStaffWorkload.AssignmentRole]}
      planning_hours: {meaning: Planning hours that week, from: [gold.FactStaffWorkload.PlanningHours]}
      event_day_hours: {meaning: Wedding-day hours that week, from: [gold.FactStaffWorkload.EventDayHours]}
      total_hours: {meaning: All hours that week, from: [gold.FactStaffWorkload.TotalHours]}
      also_on_it: {meaning: Other staff on the same wedding, rule: "string_agg(DISTINCT Nickname) of other employees with rows for the EventID", from: [gold.FactStaffWorkload.EventID, gold.DimEmployee.Nickname]}
  - id: mart_ops.v_role_week
    layer: mart
    grain: one role group × week.
    built_from: [mart_ops.v_capacity_grid]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    columns:
      week_start: {meaning: Week, from: [mart_ops.v_capacity_grid.week_start]}
      role_group: {meaning: Role group, from: [mart_ops.v_capacity_grid.role_group]}
      capacity_hours: {meaning: Contracted hours of the group, rule: Σ capacity_hours, from: [mart_ops.v_capacity_grid.capacity_hours], additivity: additive}
      assigned_hours: {meaning: Booked hours of the group, rule: Σ assigned_hours, from: [mart_ops.v_capacity_grid.assigned_hours], additivity: additive}
      utilization: {meaning: Group utilization (ratio of sums), rule: "Σ assigned_hours / Σ capacity_hours", from: [mart_ops.v_capacity_grid.assigned_hours, mart_ops.v_capacity_grid.capacity_hours]}
      overtime_hours: {meaning: Overtime, summed per person first, rule: "Σ overtime_hours (spare hours never cancel overtime)", from: [mart_ops.v_capacity_grid.overtime_hours], additivity: additive}
      person_weeks_over: {meaning: People over 100 % that week, rule: "count(*) where status = 'Over'", from: [mart_ops.v_capacity_grid.status], additivity: additive}
      wedding_assignments: {meaning: Person-weddings on the day that week, rule: Σ weddings, from: [mart_ops.v_capacity_grid.weddings], additivity: additive}
  - id: mart_ops.v_forward_demand
    layer: mart
    grain: one target week × role group of the latest forecast (next 26 weeks).
    built_from: [gold.FactDemandForecast, gold.DimDate]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    columns:
      forecast_date: {meaning: Forecast date (latest only), from: [gold.FactDemandForecast.ForecastDateKey, gold.DimDate.FullDate]}
      week_start: {meaning: Target week, from: [gold.FactDemandForecast.TargetWeekDateKey, gold.DimDate.FullDate]}
      role_group: {meaning: Role group, from: [gold.FactDemandForecast.RoleGroup]}
      booked_hours: {meaning: Already booked, from: [gold.FactDemandForecast.BookedHours]}
      pipeline_hours: {meaning: From open inquiries, from: [gold.FactDemandForecast.PipelineHours]}
      new_booking_hours: {meaning: From bookings not yet in sight, from: [gold.FactDemandForecast.NewBookingHours]}
      p10_hours: {meaning: Low end, from: [gold.FactDemandForecast.P10Hours]}
      p50_hours: {meaning: Central forecast, from: [gold.FactDemandForecast.P50Hours]}
      p90_hours: {meaning: High end, from: [gold.FactDemandForecast.P90Hours]}
      capacity_hours: {meaning: Contracted hours, from: [gold.FactDemandForecast.CapacityHours]}
      expected_utilization: {meaning: Forecast as a share of capacity, rule: "P50Hours / CapacityHours", from: [gold.FactDemandForecast.P50Hours, gold.FactDemandForecast.CapacityHours]}
      gap_hours: {meaning: Hours short (book freelancers), rule: "greatest(0, P50Hours − CapacityHours)", from: [gold.FactDemandForecast.P50Hours, gold.FactDemandForecast.CapacityHours], additivity: additive}
      status: {meaning: "Over, Tight, OK, Quiet", rule: "P50 >= capacity → Over; >= 0.85 × → Tight; >= 0.5 × → OK; else Quiet", from: [gold.FactDemandForecast.P50Hours, gold.FactDemandForecast.CapacityHours]}
      model_version: {meaning: Forecast method and version, from: [gold.FactDemandForecast.ModelVersion]}
  - id: mart_ops.v_date_check
    layer: mart
    grain: one date from today to 2028 (the shared date checker).
    built_from: [gold.DimDate, gold.FactEventBooking, mart_ops.v_role_week]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data; aisleco_sales (shared)
    columns:
      date: {meaning: The date, from: [gold.DimDate.FullDate]}
      day_name: {meaning: Weekday, from: [gold.DimDate.DayName]}
      week_start: {meaning: Week, from: [gold.DimDate.WeekStart]}
      auspicious_level: {meaning: Auspicious level, from: [gold.DimDate.AuspiciousLevel]}
      in_lent: {meaning: In Buddhist Lent, from: [gold.DimDate.IsBuddhistLent]}
      high_season: {meaning: High season, from: [gold.DimDate.IsHighSeason]}
      holiday: {meaning: Holiday, from: [gold.DimDate.HolidayName]}
      weddings_that_day: {meaning: Weddings booked that day, rule: "count(*) of FactEventBooking with IsCancelled = 0 on that EventDateKey", from: [gold.FactEventBooking.EventDateKey, gold.FactEventBooking.IsCancelled]}
      weddings_that_week: {meaning: Weddings booked that week, rule: Σ weddings of the days in the week, from: [gold.FactEventBooking.EventDateKey, gold.FactEventBooking.IsCancelled]}
      planning_headroom_hours: {meaning: Free hours of the Planning group that week, rule: "Σ (capacity_hours − assigned_hours) where role_group = 'Planning'", from: [mart_ops.v_role_week.capacity_hours, mart_ops.v_role_week.assigned_hours]}
      wedding_day_headroom_hours: {meaning: Free hours of the Wedding-day group that week, rule: "Σ (capacity_hours − assigned_hours) where role_group = 'Wedding day'", from: [mart_ops.v_role_week.capacity_hours, mart_ops.v_role_week.assigned_hours]}
  - id: mart_ops.v_peak_acceptance
    layer: mart
    grain: one requested month (inquiries for a Nov-Feb or auspicious date).
    built_from: [gold.FactInquiry, gold.DimDate, gold.DimInquiryOutcome]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    rule: "IsHighSeason OR AuspiciousLevel <> 'None' of the requested date"
    columns:
      requested_month: {meaning: Month of the requested wedding date, from: [gold.FactInquiry.RequestedEventDateKey, gold.DimDate.YearMonth]}
      peak_inquiries: {meaning: Inquiries for a peak date, rule: count(*), from: [gold.FactInquiry.InquiryID], additivity: additive}
      decided: {meaning: Decided, rule: "Σ (1 − IsOpen)", from: [gold.FactInquiry.IsOpen], additivity: additive}
      booked: {meaning: Booked, rule: Σ IsBooked, from: [gold.FactInquiry.IsBooked], additivity: additive}
      acceptance_rate: {meaning: Share of decided that booked, rule: "Σ IsBooked / Σ (1 − IsOpen)", from: [gold.FactInquiry.IsBooked, gold.FactInquiry.IsOpen]}
      lost_date_unavailable: {meaning: Lost because the date was full, rule: "count where LostReason = 'Date unavailable'", from: [gold.DimInquiryOutcome.LostReason], additivity: additive}
  - id: mart_ops.v_turned_away
    layer: mart
    grain: one requested month × auspicious level × closing month (couples lost because the date was full).
    built_from: [gold.FactInquiry, gold.DimInquiryOutcome, gold.DimDate, gold.FactEventBooking]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    columns:
      requested_month: {meaning: Requested wedding month, from: [gold.FactInquiry.RequestedEventDateKey, gold.DimDate.YearMonth]}
      auspicious_level: {meaning: Auspicious level of the requested date, from: [gold.DimDate.AuspiciousLevel]}
      closed_month: {meaning: Month the inquiry was closed, from: [gold.FactInquiry.ClosedDateKey, gold.DimDate.YearMonth]}
      couples_turned_away: {meaning: Couples lost with reason Date unavailable, rule: "count(*) where LostReason = 'Date unavailable'", from: [gold.DimInquiryOutcome.LostReason, gold.FactInquiry.OutcomeKey], additivity: additive}
      fee_at_stake_estimate: {meaning: What they might have been worth (estimate), rule: "count × median AgreedFee of non-cancelled bookings with BookingDateKey in the last 365 days × (Σ IsBooked / Σ IsQuoted over decided inquiries)", from: [gold.FactEventBooking.AgreedFee, gold.FactEventBooking.BookingDateKey, gold.FactInquiry.IsBooked, gold.FactInquiry.IsQuoted], additivity: additive}
  - id: mart_ops.v_hours_per_wedding
    layer: mart
    grain: one package family × guest band × complexity (non-cancelled weddings).
    built_from: [gold.FactEventBooking, gold.DimPackage]
    built_by: pipeline/marts/sql/10_mart_ops.sql
    load: view
    access: aisleco_ops, aisleco_exec, aisleco_data
    columns:
      package: {meaning: Package family, from: [gold.DimPackage.PackageFamily]}
      guest_band: {meaning: Guest band, from: [gold.FactEventBooking.GuestBand]}
      complexity: {meaning: Complexity, from: [gold.FactEventBooking.ComplexityLevel]}
      weddings: {meaning: Weddings, rule: count(*), from: [gold.FactEventBooking.EventID], additivity: additive}
      avg_total_hours: {meaning: Staff hours per wedding, rule: "Σ PlannedHoursTotal / count(*)", from: [gold.FactEventBooking.PlannedHoursTotal]}
      avg_planning_hours: {meaning: Planning hours per wedding, rule: "Σ PlanningHours / count(*)", from: [gold.FactEventBooking.PlanningHours]}
      avg_event_day_hours: {meaning: Wedding-day hours per wedding, rule: "Σ EventDayHours / count(*)", from: [gold.FactEventBooking.EventDayHours]}
      avg_staff: {meaning: Staff per wedding, rule: avg(StaffCount), from: [gold.FactEventBooking.StaffCount]}
  - id: mart_exec.v_monthly_kpis
    layer: mart
    grain: one calendar month from January 2023 to the as-of month.
    built_from: [gold.FactEventBooking, gold.DimDate, mart_sales.v_inquiry, mart_ops.v_capacity_grid, mart_ops.v_turned_away]
    built_by: pipeline/marts/sql/30_mart_exec.sql
    load: view
    access: aisleco_exec, aisleco_data
    columns:
      month: {meaning: Month YYYY-MM, from: [gold.DimDate.YearMonth]}
      bookings: {meaning: Weddings booked in the month (cancelled excluded), rule: "count(*) of FactEventBooking with IsCancelled = 0 by booking month", from: [gold.FactEventBooking.BookingDateKey, gold.FactEventBooking.IsCancelled], additivity: additive}
      fee_revenue: {meaning: Agreed fees booked in the month, rule: "Σ AgreedFee, IsCancelled = 0, by booking month", from: [gold.FactEventBooking.AgreedFee, gold.FactEventBooking.BookingDateKey, gold.FactEventBooking.IsCancelled], additivity: additive}
      weddings_held: {meaning: Weddings taking place in the month, rule: "count(*) IsCancelled = 0 by wedding month", from: [gold.FactEventBooking.EventDateKey, gold.FactEventBooking.IsCancelled], additivity: additive}
      inquiries: {meaning: Inquiries received in the month, rule: count(*) by inquiry_month, from: [mart_sales.v_inquiry.inquiry_month], additivity: additive}
      decided: {meaning: Of them, decided, rule: "Σ (InquiryCount − IsOpen)", from: [mart_sales.v_inquiry.InquiryCount, mart_sales.v_inquiry.IsOpen], additivity: additive}
      booked: {meaning: Of them, booked, rule: Σ IsBooked, from: [mart_sales.v_inquiry.IsBooked], additivity: additive}
      conversion: {meaning: Cohort conversion, rule: "booked / decided", from: [mart_exec.v_monthly_kpis.booked, mart_exec.v_monthly_kpis.decided]}
      median_first_reply_min: {meaning: Median minutes to first reply, online inquiries of the month, rule: "percentile_cont(0.5) of ResponseMinutes FILTER (channel_type = 'Online')", from: [mart_sales.v_inquiry.ResponseMinutes, mart_sales.v_inquiry.channel_type]}
      assigned_hours: {meaning: Hours booked for Planning and Wedding-day staff, weeks starting in the month, rule: "Σ v_capacity_grid.assigned_hours by to_char(week_start, 'YYYY-MM')", from: [mart_ops.v_capacity_grid.assigned_hours, mart_ops.v_capacity_grid.week_start], additivity: additive}
      capacity_hours: {meaning: Their contracted hours, same weeks, rule: Σ v_capacity_grid.capacity_hours, from: [mart_ops.v_capacity_grid.capacity_hours], additivity: additive}
      ops_utilization: {meaning: Staff utilization of the month (ratio of sums), rule: "assigned_hours / capacity_hours", from: [mart_exec.v_monthly_kpis.assigned_hours, mart_exec.v_monthly_kpis.capacity_hours]}
      overtime_hours: {meaning: Overtime hours, rule: Σ overtime_hours, from: [mart_ops.v_capacity_grid.overtime_hours], additivity: additive}
      person_weeks_over: {meaning: Person-weeks over 100 %, rule: "count where status = 'Over'", from: [mart_ops.v_capacity_grid.status], additivity: additive}
      turned_away: {meaning: Couples turned away, by closing month, rule: Σ couples_turned_away by closed_month, from: [mart_ops.v_turned_away.couples_turned_away, mart_ops.v_turned_away.closed_month], additivity: additive}
      fee_at_stake_estimate: {meaning: Their fee at stake (estimate), rule: Σ fee_at_stake_estimate by closed_month, from: [mart_ops.v_turned_away.fee_at_stake_estimate], additivity: additive}
  - id: mart_exec.v_channel_mix
    layer: mart
    grain: one inquiry month × channel.
    built_from: [mart_sales.v_inquiry]
    built_by: pipeline/marts/sql/30_mart_exec.sql
    load: view
    access: aisleco_exec, aisleco_data
    columns:
      month: {meaning: Inquiry month, from: [mart_sales.v_inquiry.inquiry_month]}
      channel: {meaning: Channel, from: [mart_sales.v_inquiry.channel]}
      inquiries: {meaning: Inquiries, rule: count(*), from: [mart_sales.v_inquiry.InquiryID], additivity: additive}
      booked: {meaning: Booked, rule: Σ IsBooked, from: [mart_sales.v_inquiry.IsBooked], additivity: additive}
      decided: {meaning: Decided, rule: "Σ (InquiryCount − IsOpen)", from: [mart_sales.v_inquiry.InquiryCount, mart_sales.v_inquiry.IsOpen], additivity: additive}
  - id: mart_exec.v_capacity_outlook
    layer: mart
    grain: one month × role group, from this month to about 6 months ahead.
    built_from: [mart_ops.v_role_week, mart_ops.v_forward_demand]
    built_by: pipeline/marts/sql/30_mart_exec.sql
    load: view
    access: aisleco_exec, aisleco_data
    rule: "weeks from the first day of the as-of month to as-of + 183 days"
    columns:
      month: {meaning: Month of the week start, from: [mart_ops.v_role_week.week_start]}
      role_group: {meaning: Role group, from: [mart_ops.v_role_week.role_group]}
      capacity_hours: {meaning: Contracted hours, rule: Σ capacity_hours, from: [mart_ops.v_role_week.capacity_hours], additivity: additive}
      booked_hours: {meaning: Hours already booked, rule: Σ assigned_hours, from: [mart_ops.v_role_week.assigned_hours], additivity: additive}
      forecast_hours: {meaning: Forecast P50 where a forecast exists, rule: Σ p50_hours, from: [mart_ops.v_forward_demand.p50_hours], additivity: additive}
      expected_hours: {meaning: Forecast where it exists, else booked, rule: "Σ coalesce(p50_hours, assigned_hours) per week", from: [mart_ops.v_forward_demand.p50_hours, mart_ops.v_role_week.assigned_hours], additivity: additive}
      expected_utilization: {meaning: Expected hours as a share of capacity, rule: "Σ expected_hours / Σ capacity_hours", from: [mart_exec.v_capacity_outlook.expected_hours, mart_exec.v_capacity_outlook.capacity_hours]}
  - id: mart_exec.v_lost_value
    layer: mart
    grain: one lost reason × closed by, couples closed in the last 365 days.
    built_from: [mart_sales.v_inquiry, gold.DimDate, gold.FactEventBooking, gold.FactInquiry]
    built_by: pipeline/marts/sql/30_mart_exec.sql
    load: view
    access: aisleco_exec, aisleco_data
    columns:
      lost_reason: {meaning: Reason, from: [mart_sales.v_inquiry.lost_reason]}
      closed_by: {meaning: Sales or AutoRule, from: [mart_sales.v_inquiry.closed_by]}
      lost: {meaning: Couples lost, rule: count(*), from: [mart_sales.v_inquiry.outcome], additivity: additive}
      fee_at_stake_estimate: {meaning: What they might have been worth (estimate), rule: "count of (IsQuoted = 1 OR lost_reason = 'Date unavailable') × median AgreedFee of all non-cancelled bookings × (Σ IsBooked / Σ IsQuoted over decided inquiries)", from: [mart_sales.v_inquiry.IsQuoted, mart_sales.v_inquiry.lost_reason, gold.FactEventBooking.AgreedFee, gold.FactInquiry.IsBooked, gold.FactInquiry.IsQuoted], additivity: additive}
  - id: mart_exec.v_model_value
    layer: mart
    grain: one arm of the A/B test (same as mart_sales.v_ab_result).
    built_from: [mart_sales.v_ab_result]
    built_by: pipeline/marts/sql/30_mart_exec.sql
    load: view
    access: aisleco_exec, aisleco_data
    copy_of: mart_sales.v_ab_result
  - id: mart_exec.v_model_effect
    layer: mart
    grain: one row, the A/B effect so far (same as mart_sales.v_ab_effect).
    built_from: [mart_sales.v_ab_effect]
    built_by: pipeline/marts/sql/30_mart_exec.sql
    load: view
    access: aisleco_exec, aisleco_data
    copy_of: mart_sales.v_ab_effect
  - id: mart_platform.v_runs
    layer: mart
    grain: one pipeline run.
    built_from: [etl.run]
    built_by: pipeline/marts/sql/40_mart_platform.sql
    load: view
    access: aisleco_data
    copy_of: etl.run
    columns:
      seconds: {meaning: Run time, rule: "extract(epoch FROM finished_at − started_at), 1 decimal", from: [etl.run.finished_at, etl.run.started_at]}
  - id: mart_platform.v_step_times
    layer: mart
    grain: one step attempt of a run.
    built_from: [etl.step_run]
    built_by: pipeline/marts/sql/40_mart_platform.sql
    load: view
    access: aisleco_data
    copy_of: etl.step_run
  - id: mart_platform.v_dq_results
    layer: mart
    grain: one data-quality rule evaluated in one run.
    built_from: [etl.dq_result, etl.dq_rule]
    built_by: pipeline/marts/sql/40_mart_platform.sql
    load: view
    access: aisleco_data
    copy_of: etl.dq_result
    columns:
      source: {meaning: Source the rule checks, from: [etl.dq_rule.source]}
      target: {meaning: Table the rule protects, from: [etl.dq_rule.target]}
      severity: {meaning: "reject, warn, block, info", from: [etl.dq_rule.severity]}
      description: {meaning: Rule in words, from: [etl.dq_rule.description]}
  - id: mart_platform.v_quarantine
    layer: mart
    grain: one rejected record.
    built_from: [etl.rejected_row]
    built_by: pipeline/marts/sql/40_mart_platform.sql
    load: view
    access: aisleco_data
    copy_of: etl.rejected_row
  - id: mart_platform.v_freshness
    layer: mart
    grain: one file source, or one CRM table.
    built_from: [etl.file_checkpoint, etl.watermark]
    built_by: pipeline/marts/sql/40_mart_platform.sql
    load: view
    access: aisleco_data
    columns:
      source: {meaning: "File source, or 'crm:<table>'", from: [etl.file_checkpoint.source, etl.watermark.source_table]}
      last_ingested: {meaning: Latest file ingested, or when the CRM watermark last moved, rule: "max(ingested_at); CRM: changed_at", from: [etl.file_checkpoint.ingested_at, etl.watermark.changed_at]}
      files: {meaning: Files ingested (null for CRM), rule: count(*), from: [etl.file_checkpoint.source]}
      last_run: {meaning: Latest run that touched it, rule: "max(run_id); CRM: last_run_id", from: [etl.file_checkpoint.run_id, etl.watermark.last_run_id]}
  - id: mart_platform.v_alerts
    layer: mart
    grain: one alert.
    built_from: [etl.alert]
    built_by: pipeline/marts/sql/40_mart_platform.sql
    load: view
    access: aisleco_data
    copy_of: etl.alert
  - id: mart_platform.v_model_runs
    layer: mart
    grain: one model training run.
    built_from: [ml.model_run]
    built_by: "pipeline/marts/sql/40_mart_platform.sql (created when ml.model_run exists)"
    load: view
    access: aisleco_data
    copy_of: ml.model_run
  - id: mart_platform.v_model_monitor
    layer: mart
    grain: one monitoring check result.
    built_from: [ml.monitor]
    built_by: "pipeline/marts/sql/40_mart_platform.sql (created when ml.monitor exists)"
    load: view
    access: aisleco_data
    copy_of: ml.monitor

# =====================================================================================================================
# FEATURE STORE AND ML (aisleco_dw.feature, aisleco_dw.ml; the feature definition runs in DuckDB over Silver)
# Every feature uses only rows with a timestamp before the cutoff (point in time): the same definition serves training
# (many past cutoffs) and scoring (today 00:00).
# =====================================================================================================================
  - id: feature.lead_features
    layer: feature
    grain: one inquiry × cutoff moment (training) or one open inquiry at today 00:00 (scoring).
    built_from: [silver.inquiry, silver.chat_message, silver.sales_activity, silver.fair_lead, silver.calendar_day, silver.channel, silver.package, silver.assignment, silver.event, silver.employee_contract]
    built_by: ml/sql/lead_features.sql (called by ml/data.py)
    load: "computed on demand (DuckDB query); scoring rows are stored in feature.lead_features_daily"
    access: ML job
    columns:
      inquiry_id: {meaning: Inquiry, from: [silver.inquiry.inquiry_id]}
      cutoff: {meaning: Moment the features describe (nothing at or after it is used)}
      channel: {meaning: Channel name, from: [silver.channel.channel_name, silver.inquiry.channel_id]}
      platform: {meaning: "Chat platform, 'in person' if none", rule: "coalesce(platform, 'in person')", from: [silver.channel.platform]}
      has_tracking_code: {meaning: First message carried a tracking code, rule: "(first_tracking_code IS NOT NULL)::int", from: [silver.inquiry.first_tracking_code]}
      budget_band_ord: {meaning: "Budget band as 0-3 (−1 Unknown)", rule: "300k-500k → 0, 500k-1M → 1, 1M-1.5M → 2, 1.5M+ → 3", from: [silver.inquiry.budget_band]}
      budget_midpoint_thb: {meaning: Budget midpoint, from: [silver.inquiry.budget_midpoint_thb]}
      package_interest: {meaning: "Package type of interest ('None')", from: [silver.package.package_type, silver.inquiry.indicative_package_id]}
      has_requested_date: {meaning: A wedding date was given, rule: "(requested_event_date IS NOT NULL)::int", from: [silver.inquiry.requested_event_date]}
      lead_days: {meaning: Days from cutoff to the requested date, rule: "date_diff('day', cutoff, requested_event_date)", from: [silver.inquiry.requested_event_date]}
      requested_high_season: {meaning: Requested date in Nov-Feb, from: [silver.calendar_day.is_high_season]}
      requested_auspicious: {meaning: "Auspicious level of the requested date 0-3", rule: "High 3, Medium 2, Low 1, else 0", from: [silver.calendar_day.auspicious_level]}
      requested_in_lent: {meaning: Requested date in Buddhist Lent, from: [silver.calendar_day.is_buddhist_lent]}
      arrived_outside_hours: {meaning: First message before 09:00 or from 20:00, from: [silver.inquiry.arrived_outside_hours]}
      inquiry_dow: {meaning: Weekday of the inquiry, rule: dayofweek(inquiry_at), from: [silver.inquiry.inquiry_at]}
      inquiry_month: {meaning: Month of the inquiry, rule: month(inquiry_at), from: [silver.inquiry.inquiry_at]}
      fair_lead: {meaning: Signed up at a fair before the cutoff, rule: "fair_lead row with submitted_at < cutoff exists", from: [silver.fair_lead.submission_id, silver.fair_lead.submitted_at]}
      fair_guests: {meaning: Guests stated at the fair, from: [silver.fair_lead.guests]}
      fair_venue: {meaning: "Venue type stated at the fair ('n/a')", from: [silver.fair_lead.venue_type]}
      requested_week_utilization: {meaning: Booked hours ÷ capacity of the requested wedding week as known at the cutoff (Planning + Wedding day), rule: "Σ assignment-week hours of the week assigned and booked before the cutoff ÷ Σ standard_weekly_hours of contracts valid that week", from: [silver.assignment.workload_hours, silver.assignment.assigned_at_effective, silver.event.booked_at, silver.employee_contract.standard_weekly_hours]}
      age_days: {meaning: Days since the inquiry, rule: "date_diff('day', inquiry_at, cutoff)", from: [silver.inquiry.inquiry_at]}
      customer_msgs: {meaning: Couple's messages before the cutoff, rule: "count of inbound messages with sent_at < cutoff", from: [silver.chat_message.direction, silver.chat_message.sent_at]}
      customer_msgs_3d: {meaning: Same, last 3 days, from: [silver.chat_message.direction, silver.chat_message.sent_at]}
      customer_msgs_7d: {meaning: Same, last 7 days, from: [silver.chat_message.direction, silver.chat_message.sent_at]}
      staff_msgs: {meaning: Staff messages before the cutoff, from: [silver.chat_message.sender_type, silver.chat_message.sent_at]}
      hours_since_customer_msg: {meaning: Hours since the couple last wrote, rule: "date_diff('hour', coalesce(last inbound, inquiry_at), cutoff)", from: [silver.chat_message.sent_at, silver.inquiry.inquiry_at]}
      hours_since_staff_msg: {meaning: Hours since our last message, from: [silver.chat_message.sent_at, silver.chat_message.sender_type]}
      log_response_minutes: {meaning: Log of first-reply minutes (if the reply was before the cutoff), rule: "ln(1 + response_minutes)", from: [silver.inquiry.response_minutes, silver.inquiry.first_staff_reply_at]}
      replied_within_1h: {meaning: First reply within an hour, rule: "(response_minutes < 60)::int", from: [silver.inquiry.response_minutes]}
      consulted: {meaning: Consulted before the cutoff, from: [silver.inquiry.consultation_at]}
      days_since_consult: {meaning: Days since the consultation, from: [silver.inquiry.consultation_at]}
      quoted: {meaning: Quoted before the cutoff, from: [silver.inquiry.quoted_at]}
      days_since_quote: {meaning: Days since the quote, from: [silver.inquiry.quoted_at]}
      quote_share: {meaning: Quote ÷ budget midpoint, rule: "quoted_amount / budget_midpoint_thb", from: [silver.inquiry.quoted_amount, silver.inquiry.budget_midpoint_thb]}
      quoted_amount: {meaning: Quoted fee (if quoted before the cutoff), from: [silver.inquiry.quoted_amount]}
      n_ask_price: {meaning: "Count of the couple's messages before the cutoff carrying this intent", rule: "Σ intent_* of messages with sent_at < cutoff", from: [silver.chat_message.intent_ask_price, silver.chat_message.sent_at]}
      n_ask_availability: {meaning: Messages asking if the date is free, rule: Σ intent_ask_availability, from: [silver.chat_message.intent_ask_availability]}
      n_mention_date: {meaning: Messages mentioning a date, rule: Σ intent_mention_date, from: [silver.chat_message.intent_mention_date]}
      n_mention_guests: {meaning: Messages mentioning a guest count, rule: Σ intent_mention_guests, from: [silver.chat_message.intent_mention_guests]}
      n_ask_package_detail: {meaning: Messages asking what a package includes, rule: Σ intent_ask_package_detail, from: [silver.chat_message.intent_ask_package_detail]}
      n_ask_meeting: {meaning: Messages asking to meet, rule: Σ intent_ask_meeting, from: [silver.chat_message.intent_ask_meeting]}
      n_price_objection: {meaning: Messages objecting to the price, rule: Σ intent_price_objection, from: [silver.chat_message.intent_price_objection]}
      n_family_decision: {meaning: Messages deferring to family, rule: Σ intent_family_decision, from: [silver.chat_message.intent_family_decision]}
      n_competitor: {meaning: Messages mentioning other planners, rule: Σ intent_competitor, from: [silver.chat_message.intent_competitor]}
      n_positive: {meaning: Positive messages, rule: Σ intent_positive, from: [silver.chat_message.intent_positive]}
      n_commit: {meaning: Messages signalling a commitment, rule: Σ intent_commit, from: [silver.chat_message.intent_commit]}
      followups: {meaning: Follow-ups before the cutoff, from: [silver.sales_activity.activity_at]}
      followups_7d: {meaning: Follow-ups in the last 7 days, from: [silver.sales_activity.activity_at]}
      days_since_followup: {meaning: Days since the last follow-up, from: [silver.sales_activity.activity_at]}
      last_followup_reached: {meaning: The last follow-up reached the couple, rule: "arg_max(outcome = 'Reached', activity_at)", from: [silver.sales_activity.outcome]}
      previous_inquiries: {meaning: Earlier inquiries of the same couple, rule: "count of inquiries of the CustomerID with an earlier inquiry_at", from: [silver.inquiry.customer_id, silver.inquiry.inquiry_at]}
  - id: feature.registry
    layer: feature
    grain: one model feature.
    built_by: "ml/__main__.py init (descriptions per feature group; ml/data.py GROUPS)"
    load: upsert on feature
    access: aisleco_data, ML job
    columns:
      feature: {meaning: Feature name (a column of feature.lead_features)}
      feature_group: {meaning: "profile, engagement, stage, text_rules, sales_activity, capacity"}
      dtype: {meaning: category or number}
      description: {meaning: What the group of features means}
      source: {meaning: "Where it is computed (ml/sql/lead_features.sql over Silver)"}
      owner: {meaning: Owner (data team)}
      version: {meaning: Definition version}
      added_on: {meaning: Date added}
  - id: feature.lead_features_daily
    layer: feature
    grain: one open inquiry per score date (offline store of the features served).
    built_from: [feature.lead_features]
    built_by: ml/score.py
    load: "daily: delete the score date, insert"
    access: aisleco_data, ML job
    columns:
      score_date: {meaning: Score date}
      inquiry_id: {meaning: Inquiry, from: [feature.lead_features.inquiry_id]}
      features: {meaning: All feature values as JSON, from: [feature.lead_features.inquiry_id]}
  - id: ml.model_run
    layer: feature
    grain: one training run of a model, promoted or not.
    built_by: ml/train.py, ml/forecast.py
    load: insert per run
    access: aisleco_data
    columns:
      model: {meaning: "lead_conversion or staffing_demand"}
      version: {meaning: Model version}
      mlflow_run_id: {meaning: MLflow run}
      trained_at: {meaning: Training time}
      asof_date: {meaning: Data as of}
      algorithm: {meaning: Algorithm}
      train_window: {meaning: Training period}
      test_window: {meaning: Test period}
      train_rows: {meaning: Training rows}
      test_rows: {meaning: Test rows}
      params: {meaning: Hyper-parameters (JSON)}
      metrics: {meaning: Test metrics (JSON)}
      decision: {meaning: Training-gate decision in words}
      status: {meaning: "champion or rejected (training gate)"}
  - id: ml.monitor
    layer: feature
    grain: one check × subject × date (drift, calibration, matured-label performance).
    built_by: ml/monitor.py
    load: upsert per check date
    access: aisleco_data
    columns:
      check_date: {meaning: Date of the check}
      model: {meaning: Model}
      model_version: {meaning: Version checked}
      check_name: {meaning: "e.g. PSI drift, ECE, PR-AUC"}
      subject: {meaning: Feature or metric checked}
      value: {meaning: Measured value}
      threshold: {meaning: Alert threshold}
      status: {meaning: ok or alert}
      detail: {meaning: Explanation}

# =====================================================================================================================
# RUN LOG (aisleco_dw.etl, written by the pipeline; read through mart_platform)
# =====================================================================================================================
  - id: etl.run
    layer: govern
    grain: one pipeline run.
    built_by: pipeline/pipeline.py (schema pipeline/sql/etl_schema.sql)
    load: insert at start, update at the end
    access: aisleco_data
    columns:
      run_id: {meaning: Run number}
      asof_date: {meaning: Business date the run covers ("today" on the dashboards = the latest successful run's)}
      mode: {meaning: incremental or full}
      triggered_by: {meaning: "airflow, cli, pytest"}
      status: {meaning: "running, success, failed"}
      message: {meaning: Error or summary}
      started_at: {meaning: Start}
      finished_at: {meaning: End}
  - id: etl.step_run
    layer: govern
    grain: one attempt of one step in a run.
    built_by: pipeline/pipeline.py
    load: insert per attempt
    access: aisleco_data
    columns:
      step_run_id: {meaning: Row number}
      run_id: {meaning: Run}
      step: {meaning: "Step name (ingest_crm, ingest_files, silver, load_stg, gold_dims, fact_*, reconcile, marts, finish)"}
      attempt: {meaning: Attempt number (retries)}
      status: {meaning: success or failed}
      started_at: {meaning: Start}
      finished_at: {meaning: End}
      duration_sec: {meaning: Seconds}
      rows_in: {meaning: Rows read}
      rows_out: {meaning: Rows written or changed}
      metrics: {meaning: Step details (JSON)}
      error: {meaning: Error text}
  - id: etl.dq_rule
    layer: govern
    grain: one data-quality rule.
    built_by: pipeline/quality/rules.yml (loaded each run)
    load: upsert
    access: aisleco_data
    columns:
      rule_id: {meaning: "Rule id (R01..R41, S01..S05, C01..C05)"}
      source: {meaning: Source checked}
      target: {meaning: Table protected}
      severity: {meaning: "reject, warn, block, info"}
      description: {meaning: Rule in words}
  - id: etl.dq_result
    layer: govern
    grain: one rule evaluated in one run.
    built_by: pipeline/quality
    load: insert per run
    access: aisleco_data
    columns:
      run_id: {meaning: Run}
      rule_id: {meaning: Rule}
      rows_checked: {meaning: Rows checked}
      rows_failed: {meaning: Rows that broke the rule}
      passed: {meaning: Rule passed}
      checked_at: {meaning: When}
  - id: etl.rejected_row
    layer: govern
    grain: one rejected record (index of lake/quarantine).
    built_by: pipeline/quality
    load: "upsert; resolved_run_id set when a later run loads the corrected record"
    access: aisleco_data
    columns:
      source: {meaning: Source}
      target: {meaning: Target table}
      record_key: {meaning: Key of the record}
      rule_id: {meaning: Rule broken}
      reason: {meaning: Reason in words}
      record: {meaning: The full record (JSON)}
      quarantine_file: {meaning: File in lake/quarantine}
      first_run_id: {meaning: First run that rejected it}
      last_run_id: {meaning: Latest run that rejected it}
      resolved_run_id: {meaning: Run that finally loaded it}
  - id: etl.file_checkpoint
    layer: govern
    grain: one ingested file.
    built_by: pipeline/ingest/files.py
    load: insert per file
    access: aisleco_data
    columns:
      source: {meaning: "chat, fair_tablet, th_holidays, auspicious"}
      bronze_path: {meaning: Path in Bronze}
      landing_name: {meaning: Name in landing}
      bytes: {meaning: Size}
      sha256: {meaning: Checksum}
      rows: {meaning: Lines or records}
      run_id: {meaning: Run that ingested it}
      ingested_at: {meaning: When}
      note: {meaning: "e.g. repeated batch"}
  - id: etl.watermark
    layer: govern
    grain: one incremental CRM table.
    built_by: pipeline/ingest/crm_cdc.py
    load: update per run
    access: aisleco_data
    columns:
      source_table: {meaning: CRM table}
      last_updated_at: {meaning: "Highest UpdatedAt loaded (W)"}
      extracted_at: {meaning: "Snapshot time of the last extraction (S_prev)"}
      last_run_id: {meaning: Run that moved it}
      changed_at: {meaning: When it last moved}
  - id: etl.alert
    layer: govern
    grain: one alert raised by a run.
    built_by: pipeline/pipeline.py
    load: insert
    access: aisleco_data
    columns:
      alert_id: {meaning: Alert number}
      run_id: {meaning: Run}
      severity: {meaning: "warning or error"}
      message: {meaning: Alert text}
      created_at: {meaning: When}

# =====================================================================================================================
# WORKED EXAMPLES (from the specs; shown on the catalog page)
# =====================================================================================================================
examples:
  - id: line_message
    title: "One LINE message, landing → Silver"
    source: Spec 02 §6
    intro: "Mint taps a TikTok link; LINE opens with #TIKTOK typed and she sends \"ว่างวันที่ 13 ก.พ. ไหมคะ แขกประมาณ 300 คนค่ะ\" (is 13 Feb free? about 300 guests)."
    steps:
      - {where: "13:02, LINE → chat gateway", what: "LINE POSTs the webhook JSON. The gateway checks the signature and appends one line to landing/chat/platform=line/received_date=2026-11-16/hour=13/events.jsonl. LINE did not get the 200 in time and re-sends: a second identical line.", refs: [bronze.chat.body, bronze.chat.received_at]}
      - {where: "02:00 next night, ingest_chat", what: "The closed hourly file moves to bronze/chat/…/hour=13/events.jsonl (2 lines); SHA-256 recorded in etl.file_checkpoint.", refs: [etl.file_checkpoint.sha256]}
      - {where: "silver_build, chat_message", what: "2 lines → 1 message (1 re-delivery counted, rule R22). 1794808920000 ms UTC → 2026-11-16 13:02:00 Bangkok. Tracking code #TIKTOK. intent_ask_availability = 1, intent_mention_date = 1, intent_mention_guests = 1. Masked text to silver_restricted.lead_text.", refs: [silver.chat_message.platform_message_id, silver.chat_message.sent_at, silver.chat_message.tracking_code, silver.chat_message.intent_ask_availability, silver.chat_message.intent_mention_date, silver.chat_message.intent_mention_guests, silver_restricted.lead_text.text_masked]}
      - {where: "silver_build, inquiry", what: "May's reply at 13:09 is the first staff outbound message → response_minutes = 7, response_band = '< 1 h'.", refs: [silver.inquiry.first_staff_reply_at, silver.inquiry.response_minutes, silver.inquiry.response_band]}
      - {where: Gold and dashboards, what: "See the Mint and Jay example below.", refs: []}
  - id: hours_spread
    title: "The hours-spread rule: Som's 80 hours"
    source: Spec 03 §4.3
    intro: "Som has 80 h on Ploy and Ton's wedding (Saturday 16 Jan 2027), assigned Thursday 2 Apr 2026. FactStaffWorkload places those hours in the weeks they are worked."
    steps:
      - {where: silver.assignment, what: "event_day_hours = min(12, 80) = 12 h; planning_hours = 80 − 12 = 68 h.", refs: [silver.assignment.event_day_hours, silver.assignment.planning_hours]}
      - {where: Planning weeks, what: "From the week of the assignment (30 Mar 2026) to the week before the wedding week (4 Jan 2027): n = 41 weeks, so n > 10.", refs: [silver.assignment.assigned_at_effective, gold.FactStaffWorkload.WeekStartDateKey]}
      - {where: "Kick-off: weeks 1-2 (30 Mar, 6 Apr)", what: "68 × 20 % ÷ 2 = 6.80 h each → 13.6 h", refs: [gold.FactStaffWorkload.PlanningHours]}
      - {where: "Between: weeks 3-33 (13 Apr … 9 Nov)", what: "68 × 30 % ÷ 31 = 0.658 h each → 20.4 h", refs: [gold.FactStaffWorkload.PlanningHours]}
      - {where: "Final preparations: weeks 34-41 (16 Nov … 4 Jan)", what: "68 × 50 % ÷ 8 = 4.25 h each → 34.0 h", refs: [gold.FactStaffWorkload.PlanningHours]}
      - {where: "Wedding week (11 Jan 2027)", what: "12 h wedding-day hours.", refs: [gold.FactStaffWorkload.EventDayHours]}
      - {where: Check, what: "13.6 + 20.4 + 34.0 = 68.0 planning h; + 12 = 80 h. Spreading neither creates nor loses hours (reconciliation C03).", refs: [gold.FactStaffWorkload.TotalHours]}
  - id: mint_and_jay
    title: "Mint and Jay, source → dashboard"
    source: Spec 03 §9
    intro: "IDs and headroom figures are illustrative (from the spec); the simulated data produces its own values."
    steps:
      - {where: "CRM Inquiry 18877", what: "Created 13:02 from the LINE webhook; channel TikTok; requested 13 Feb 2027; budget \"1M-1.5M\"; owner May.", refs: [crm.transaction.Inquiry.InquiryID, crm.transaction.Inquiry.RequestedEventDate, crm.transaction.Inquiry.BudgetRange, crm.transaction.Inquiry.AssignedSalesEmployeeID]}
      - {where: "Bronze, Silver", what: "One message, response 7 minutes, intents ask_availability + mention_date + mention_guests (example above).", refs: [silver.inquiry.response_minutes]}
      - {where: "CRM, next day", what: "May closes it: Lost, \"Date unavailable\", ClosedBy Sales.", refs: [crm.transaction.Inquiry.Status, crm.transaction.Inquiry.LostReason, crm.transaction.Inquiry.ClosedBy]}
      - {where: gold.FactInquiry, what: "RequestedEventDateKey 20270213 (high season, auspicious High); OutcomeKey → (Lost, Contacted, Sales, Date unavailable); ResponseMinutes 7.", refs: [gold.FactInquiry.RequestedEventDateKey, gold.FactInquiry.OutcomeKey, gold.DimInquiryOutcome.LostReason, gold.FactInquiry.ResponseMinutes]}
      - {where: mart_ops.v_turned_away, what: "+1 couple in requested month 2027-02, auspicious High.", refs: [mart_ops.v_turned_away.couples_turned_away]}
      - {where: "mart_ops.v_date_check, 13 Feb 2027", what: "2 weddings booked; coordinator headroom −4 h → Full. Suggests Sat 20 Feb (High, 1 wedding, headroom +18 h).", refs: [mart_ops.v_date_check.weddings_that_day, mart_ops.v_date_check.wedding_day_headroom_hours]}
      - {where: Operations page, what: "The turned-away bar for Feb 2027 shows her; the date checker shows the same suggestion May gave.", refs: []}
