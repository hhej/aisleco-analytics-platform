      indicative_package_id: {meaning: Package of interest, from: [crm.transaction.Inquiry.IndicativePackageID]}
      sales_owner_id: {meaning: Salesperson who owns the lead, from: [crm.transaction.Inquiry.AssignedSalesEmployeeID]}
      inquiry_at: {meaning: When the couple got in touch, from: [crm.transaction.Inquiry.InquiryDate]}
