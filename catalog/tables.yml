      employment_type: {meaning: "FullTime, PartTime, Freelance", from: [crm.master.EmployeeContract.EmploymentType]}
      standard_weekly_hours: {meaning: Contracted hours per week, from: [crm.master.EmployeeContract.StandardWeeklyHours]}
      max_concurrent_events: {meaning: Weddings per week the person can run, from: [crm.master.EmployeeContract.MaxConcurrentEvents]}
      effective_from: {meaning: Contract start, from: [crm.master.EmployeeContract.EffectiveFrom]}
      effective_to: {meaning: "Contract end (null = open)", from: [crm.master.EmployeeContract.EffectiveTo]}
